{{- if .Values.fleetAssessment.enabled }}
{{- if and .Values.fleetCapacity.roleArn (eq .Values.fleetAssessment.roleArn .Values.fleetCapacity.roleArn) }}{{ fail "capacity and financial assessment require distinct IRSA identities" }}{{ end }}
{{- if not .Values.networkPolicy.enabled }}{{ fail "fleet assessment requires default-deny network policy" }}{{ end }}
{{- if ne .Values.dataMode "aws" }}{{ fail "hosted fleet assessment requires explicit AWS read-only mode" }}{{ end }}
{{- $_ := required "fleet assessment requires a commissioned tenant" .Values.aws.tenantId }}
{{- $_ := required "fleet assessment requires existing Ireland evidence storage" .Values.aws.rawBucket }}
{{- $_ := required "fleet assessment requires the reviewed RDS trust bundle" .Values.database.caConfigMap }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$" .Values.aws.tenantId) }}{{ fail "fleet assessment requires an exact tenant identifier" }}{{ end }}
{{- if not (regexMatch "^[0-9]{12}$" .Values.fleetAssessment.bucketOwner) }}{{ fail "fleet assessment requires the exact evidence bucket owner" }}{{ end }}
{{- if not (regexMatch "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$" .Values.fleetAssessment.roleArn) }}{{ fail "fleet assessment requires an exact dedicated IRSA role ARN" }}{{ end }}
{{- if has .Values.fleetAssessment.roleArn (list .Values.aws.readRoleArn .Values.aws.executionRoleArn .Values.hardware.roleArn .Values.fleetHistory.roleArn .Values.telemetry.readerRoleArn .Values.telemetry.ingressRoleArn) }}{{ fail "fleet assessment cannot reuse another service or customer IAM identity" }}{{ end }}
{{- range $key,$arn := .Values.aws }}{{ if and (hasSuffix "RoleArn" $key) (eq (toString $arn) $.Values.fleetAssessment.roleArn) }}{{ fail "fleet assessment cannot reuse any configured AWS role identity" }}{{ end }}{{ end }}
{{- $database := required "fleet assessment requires a distinct database login secret" (index .Values.database.secrets "fleet-assessment") }}
{{- if or (gt (len $database) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $database)) }}{{ fail "fleet assessment requires an exact existing database secret name" }}{{ end }}
{{- range $role,$secret := .Values.database.secrets }}{{ if and (ne $role "fleet-assessment") (eq $database $secret) }}{{ fail "fleet assessment cannot reuse another process database secret" }}{{ end }}{{ end }}
{{- range $name,$secret := .Values.secrets }}{{ if eq $database $secret }}{{ fail "fleet assessment database cannot share a service credential bundle" }}{{ end }}{{ end }}
{{- if not (regexMatch "^[1-3]$" (toString .Values.fleetAssessment.replicas)) }}{{ fail "fleet assessment replicas must be between one and three" }}{{ end }}
{{- if eq (len .Values.fleetAssessment.httpsEgressCidrs) 0 }}{{ fail "fleet assessment requires approved regional HTTPS destinations" }}{{ end }}
{{- if eq (len .Values.fleetAssessment.postgresEgressCidrs) 0 }}{{ fail "fleet assessment requires approved private RDS destinations" }}{{ end }}
{{- $octet := "(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])" }}
{{- $cidr := printf "^%s([.]%s){3}/([1-9]|[12][0-9]|3[0-2])$" $octet $octet }}
{{- range .Values.fleetAssessment.httpsEgressCidrs }}
{{- if or (not (regexMatch $cidr .)) (lt (int (last (splitList "/" .))) 16) (regexMatch "^(0[.]|127[.]|169[.]254[.]|2(2[4-9]|[3-5][0-9])[.])" .) }}{{ fail "fleet assessment HTTPS requires bounded approved IPv4 networks without metadata or loopback" }}{{ end }}
{{- end }}
{{- range .Values.fleetAssessment.postgresEgressCidrs }}
{{- if or (not (regexMatch $cidr .)) (lt (int (last (splitList "/" .))) 16) (not (or (hasPrefix "10." .) (regexMatch "^172[.](1[6-9]|2[0-9]|3[01])[.]" .) (hasPrefix "192.168." .))) }}{{ fail "fleet assessment RDS requires bounded reviewed private IPv4 networks" }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-fleet-assessment
  labels: {finops-role: fleet-assessment}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.fleetAssessment.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-fleet-assessment
  labels: {finops-role: fleet-assessment}
spec:
  replicas: {{ .Values.fleetAssessment.replicas }}
  selector:
    matchLabels: {finops-role: fleet-assessment}
  template:
    metadata:
      labels: {finops-role: fleet-assessment}
    spec:
      serviceAccountName: finops-fleet-assessment
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fleet-assessment
          image: {{ include "finops.image" .Values.images.backend | quote }}
          command: [/app/fleet-assessment-worker]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: FLEET_ASSESSMENT_ENABLED, value: "true"}
            - {name: FLEET_ASSESSMENT_TENANT_ID, value: {{ .Values.aws.tenantId | quote }}}
            - {name: FLEET_ASSESSMENT_DATABASE_FILE, value: /run/secrets/group-assessment-database}
            - {name: FLEET_ASSESSMENT_ARCHIVE_MODE, value: AWS_IRSA}
            - {name: FLEET_ASSESSMENT_ARCHIVE_REGION, value: eu-west-1}
            - {name: FLEET_ASSESSMENT_ARCHIVE_BUCKET, value: {{ .Values.aws.rawBucket | quote }}}
            - {name: FLEET_ASSESSMENT_ARCHIVE_BUCKET_OWNER, value: {{ .Values.fleetAssessment.bucketOwner | quote }}}
            - {name: AWS_REGION, value: eu-west-1}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # File mount avoids following projected-secret symlinks inside the
            # worker. Restart this optional deployment after DB secret rotation.
            - {name: database, mountPath: /run/secrets/group-assessment-database, subPath: DATABASE_URL, readOnly: true}
            - {name: rds-ca, mountPath: /etc/finops/rds, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: database
          secret:
            secretName: {{ $database }}
            defaultMode: 0440
            items: [{key: DATABASE_URL, path: DATABASE_URL}]
        - name: rds-ca
          configMap: {name: {{ .Values.database.caConfigMap }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: finops-fleet-assessment-egress}
spec:
  podSelector:
    matchLabels: {finops-role: fleet-assessment}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        {{- range .Values.fleetAssessment.httpsEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    - to:
        {{- range .Values.fleetAssessment.postgresEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
{{- end }}
