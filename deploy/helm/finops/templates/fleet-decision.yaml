{{- if not (kindIs "bool" .Values.fleetDecision.enabled) }}{{ fail "fleet decision enabled must be a boolean" }}{{ end }}
{{- if .Values.fleetDecision.enabled }}
{{- if not .Values.networkPolicy.enabled }}{{ fail "fleet decision requires default-deny network policy" }}{{ end }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$" .Values.fleetDecision.tenantId) }}{{ fail "fleet decision requires an exact commissioned tenant" }}{{ end }}
{{- $database := required "fleet decision requires a dedicated database login secret" (index .Values.database.secrets "fleet-decision") }}
{{- if or (gt (len $database) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $database)) }}{{ fail "fleet decision requires an exact database secret name" }}{{ end }}
{{- range $role,$secret := .Values.database.secrets }}{{ if and (ne $role "fleet-decision") (eq $database $secret) }}{{ fail "fleet decision cannot reuse another process database secret" }}{{ end }}{{ end }}
{{- range $name,$secret := .Values.secrets }}{{ if eq $database $secret }}{{ fail "fleet decision database cannot share a service credential bundle" }}{{ end }}{{ end }}
{{- $ca := required "fleet decision requires the operator-verified database CA bundle" .Values.database.caConfigMap }}
{{- if or (gt (len $ca) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $ca)) }}{{ fail "fleet decision requires an exact CA ConfigMap name" }}{{ end }}
{{- if not (regexMatch "^[1-3]$" (toString .Values.fleetDecision.replicas)) }}{{ fail "fleet decision replicas must be between one and three" }}{{ end }}
{{- if or (eq (len .Values.fleetDecision.postgresEgressCidrs) 0) (gt (len .Values.fleetDecision.postgresEgressCidrs) 16) }}{{ fail "fleet decision requires one to sixteen approved private database networks" }}{{ end }}
{{- $octet := "(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])" }}
{{- $cidr := printf "^%s([.]%s){3}/(1[6-9]|2[0-9]|3[0-2])$" $octet $octet }}
{{- range .Values.fleetDecision.postgresEgressCidrs }}
{{- if or (not (regexMatch $cidr .)) (not (or (hasPrefix "10." .) (regexMatch "^172[.](1[6-9]|2[0-9]|3[01])[.]" .) (hasPrefix "192.168." .))) }}{{ fail "fleet decision requires bounded operator-approved private IPv4 database networks" }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-fleet-decision
  labels: {finops-role: fleet-decision}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-fleet-decision
  labels: {finops-role: fleet-decision}
spec:
  replicas: {{ .Values.fleetDecision.replicas }}
  selector:
    matchLabels: {finops-role: fleet-decision}
  template:
    metadata:
      labels: {finops-role: fleet-decision}
    spec:
      serviceAccountName: finops-fleet-decision
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fleet-decision
          image: {{ include "finops.image" .Values.images.backend | quote }}
          command: [/app/fleet-decision-worker]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: FLEET_DECISION_ENABLED, value: "true"}
            - {name: FLEET_DECISION_TENANT_ID, value: {{ .Values.fleetDecision.tenantId | quote }}}
            - {name: FLEET_DECISION_DATABASE_FILE, value: /run/secrets/group-decision-database}
            - {name: FLEET_DECISION_DATABASE_MODE, value: HOSTED_TLS}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # Restart after rotation. A subPath file avoids projected-secret
            # symlinks; the worker independently verifies its exact file path.
            - {name: database, mountPath: /run/secrets/group-decision-database, subPath: DATABASE_URL, readOnly: true}
            - {name: database-ca, mountPath: /run/ca/group-decision-root.crt, subPath: ca.crt, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: database
          secret:
            secretName: {{ $database }}
            defaultMode: 288 # 0440, explicit decimal for YAML/JSON portability
            items: [{key: DATABASE_URL, path: DATABASE_URL}]
        - name: database-ca
          configMap:
            name: {{ $ca }}
            defaultMode: 292 # 0444
            items: [{key: ca.crt, path: ca.crt}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: finops-fleet-decision-egress}
spec:
  podSelector:
    matchLabels: {finops-role: fleet-decision}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        {{- range .Values.fleetDecision.postgresEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
{{- end }}
