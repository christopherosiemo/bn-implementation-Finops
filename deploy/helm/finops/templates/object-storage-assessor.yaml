{{- if .Values.objectStorageAssessor.enabled }}
{{- if not .Values.networkPolicy.enabled }}{{ fail "object-storage assessor requires default-deny network policy" }}{{ end }}
{{- if ne .Values.dataMode "aws" }}{{ fail "hosted object-storage assessor requires explicit AWS read-only mode" }}{{ end }}
{{- $_ := required "object-storage assessor requires existing evidence storage" .Values.aws.rawBucket }}
{{- $_ := required "object-storage assessor requires the PostgreSQL TLS trust bundle" .Values.database.caConfigMap }}
{{- $database := required "object-storage assessor requires a dedicated database login Secret" (index .Values.database.secrets "object-storage-assessor") }}
{{- $reader := required "object-storage assessor requires a version-only evidence reader Secret" .Values.objectStorageAssessor.evidenceReaderSecret }}
{{- range $name := list $database $reader }}
{{- if or (gt (len $name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $name)) }}{{ fail "object-storage assessor requires exact existing Secret names" }}{{ end }}
{{- end }}
{{- if eq $database $reader }}{{ fail "database and evidence reader Secrets must differ" }}{{ end }}
{{- if or (eq $database .Values.databaseAssessor.evidenceReaderSecret) (eq $reader .Values.databaseAssessor.evidenceReaderSecret) }}{{ fail "object-storage assessor cannot reuse the database assessor evidence identity" }}{{ end }}
{{- if or (eq $database .Values.storageAssessor.evidenceReaderSecret) (eq $reader .Values.storageAssessor.evidenceReaderSecret) }}{{ fail "object-storage assessor cannot reuse the EBS assessor evidence identity" }}{{ end }}
{{- range $role,$secret := .Values.database.secrets }}
{{- if and (ne $role "object-storage-assessor") (or (eq $database $secret) (eq $reader $secret)) }}{{ fail "object-storage assessor cannot reuse another process database Secret" }}{{ end }}
{{- end }}
{{- range $role,$secret := .Values.secrets }}
{{- if or (eq $database $secret) (eq $reader $secret) }}{{ fail "object-storage assessor cannot reuse another service credential bundle" }}{{ end }}
{{- end }}
{{- if not (regexMatch "^[1-3]$" (toString .Values.objectStorageAssessor.replicas)) }}{{ fail "object-storage assessor replicas must be one through three" }}{{ end }}
{{- if and .Values.objectStorage.endpoint (not (hasPrefix "https://" .Values.objectStorage.endpoint)) }}{{ fail "hosted object-storage evidence endpoint must use verified HTTPS" }}{{ end }}
{{- if or (eq (len .Values.objectStorageAssessor.httpsEgressCidrs) 0) (eq (len .Values.objectStorageAssessor.postgresEgressCidrs) 0) }}{{ fail "object-storage assessor requires explicit evidence HTTPS and private PostgreSQL destinations" }}{{ end }}
{{- $octet := "(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])" }}
{{- $cidr := printf "^%s([.]%s){3}/([1-9]|[12][0-9]|3[0-2])$" $octet $octet }}
{{- range .Values.objectStorageAssessor.httpsEgressCidrs }}
{{- if or (not (regexMatch $cidr .)) (lt (int (last (splitList "/" .))) 16) (regexMatch "^(0[.]|127[.]|169[.]254[.]|2(2[4-9]|[3-5][0-9])[.])" .) }}{{ fail "object-storage evidence HTTPS requires bounded approved networks" }}{{ end }}
{{- end }}
{{- range .Values.objectStorageAssessor.postgresEgressCidrs }}
{{- if or (not (regexMatch $cidr .)) (lt (int (last (splitList "/" .))) 16) (not (or (hasPrefix "10." .) (regexMatch "^172[.](1[6-9]|2[0-9]|3[01])[.]" .) (hasPrefix "192.168." .))) }}{{ fail "object-storage assessor requires bounded private PostgreSQL networks" }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-object-storage-assessor
  labels: {finops-role: object-storage-assessor}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-object-storage-assessor
  labels: {finops-role: object-storage-assessor}
spec:
  replicas: {{ .Values.objectStorageAssessor.replicas }}
  selector:
    matchLabels: {finops-role: object-storage-assessor}
  template:
    metadata:
      labels: {finops-role: object-storage-assessor}
    spec:
      serviceAccountName: finops-object-storage-assessor
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: object-storage-assessor
          image: {{ include "finops.image" .Values.images.backend | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: APP_ROLE, value: object-storage-assessor}
            - {name: PORT, value: "8080"}
            - {name: FIXTURE_MODE, value: "false"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $database | quote }}, key: DATABASE_URL}
            - {name: ECONOMICS_URL, value: "http://finops-economics:8000"}
            - name: ECONOMICS_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.economics | quote }}, key: ECONOMICS_TOKEN}
            - {name: OBJECT_ENDPOINT, value: {{ .Values.objectStorage.endpoint | quote }}}
            - {name: OBJECT_REGION, value: eu-west-1}
            - {name: OBJECT_BUCKET_RAW, value: {{ .Values.aws.rawBucket | quote }}}
            - name: OBJECT_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ $reader | quote }}, key: OBJECT_ACCESS_KEY}
            - name: OBJECT_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ $reader | quote }}, key: OBJECT_SECRET_KEY}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: rds-ca, mountPath: /etc/finops/rds, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: rds-ca
          configMap: {name: {{ .Values.database.caConfigMap | quote }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: finops-object-storage-assessor-egress}
spec:
  podSelector:
    matchLabels: {finops-role: object-storage-assessor}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels: {finops-role: economics}
      ports: [{protocol: TCP, port: 8000}]
    - to:
        {{- range .Values.objectStorageAssessor.httpsEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    - to:
        {{- range .Values.objectStorageAssessor.postgresEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: finops-economics-from-object-storage-assessor}
spec:
  podSelector:
    matchLabels: {finops-role: economics}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {finops-role: object-storage-assessor}
      ports: [{protocol: TCP, port: 8000}]
{{- end }}
