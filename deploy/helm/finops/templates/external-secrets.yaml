{{- if .Values.externalSecrets.enabled }}
{{- $_ := required "aws.signerRoleArn required for signer secret delivery" .Values.aws.signerRoleArn }}
{{- $_ := required "aws.executorRoleArn required for execution secret delivery" .Values.aws.executorRoleArn }}
{{- range $role, $arn := dict "signer" .Values.externalSecrets.signerSecretArn "executor" .Values.externalSecrets.executionSecretArn }}
{{- $_ := required (printf "externalSecrets secret ARN required for %s" $role) $arn }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: finops-{{ $role }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $.Values.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: finops-{{ $role }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finops-{{ $role }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: finops-{{ $role }}
    kind: SecretStore
  target:
    name: {{ index $.Values.secrets $role }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $arn | quote }}
{{- end }}
{{- end }}
