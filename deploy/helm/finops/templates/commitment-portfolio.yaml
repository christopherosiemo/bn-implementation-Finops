{{- if not (kindIs "bool" .Values.commitmentPortfolio.enabled) }}{{ fail "commitment portfolio enabled must be a boolean" }}{{ end }}
{{- if .Values.commitmentPortfolio.enabled }}
{{- if not .Values.networkPolicy.enabled }}{{ fail "commitment portfolio requires default-deny network policy" }}{{ end }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$" .Values.commitmentPortfolio.tenantId) }}{{ fail "commitment portfolio requires an exact commissioned tenant" }}{{ end }}
{{- $database := required "commitment portfolio requires a dedicated database login secret" (index .Values.database.secrets "commitment-portfolio") }}
{{- $token := required "commitment portfolio requires a dedicated model token secret" .Values.commitmentPortfolio.modelTokenSecret }}
{{- $tls := required "commitment portfolio requires the actual model TLS certificate and private key" .Values.commitmentPortfolio.modelTLSSecret }}
{{- $databaseCA := required "commitment portfolio requires the verified database CA bundle" .Values.database.caConfigMap }}
{{- $modelCA := required "commitment portfolio requires the verified private model root CA" .Values.commitmentPortfolio.modelCAConfigMap }}
{{- range $name := list $database $token $tls $databaseCA $modelCA }}
{{- if or (gt (len $name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $name)) }}{{ fail "commitment portfolio requires exact Secret/ConfigMap names" }}{{ end }}
{{- end }}
{{- if or (eq $database $token) (eq $database $tls) (eq $token $tls) }}{{ fail "commitment portfolio database, model token and TLS key must use separate Secrets" }}{{ end }}
{{- if eq $databaseCA $modelCA }}{{ fail "commitment portfolio model and database CA ConfigMaps must be separate" }}{{ end }}
{{- range $role,$secret := .Values.database.secrets }}
{{- if and (ne $role "commitment-portfolio") (has $secret (list $database $token $tls)) }}{{ fail "commitment portfolio cannot reuse another database secret" }}{{ end }}
{{- end }}
{{- range $role,$secret := .Values.secrets }}
{{- if has $secret (list $database $token $tls) }}{{ fail "commitment portfolio cannot share another process credential bundle" }}{{ end }}
{{- end }}
{{- range $secret := list .Values.aws.externalIdSecret .Values.sources.readBindingsSecret .Values.hardware.targetsSecret .Values.fleetHistory.targetsSecret .Values.fleetHistory.readBindingsSecret .Values.telemetry.readerTokenSecret .Values.telemetry.readBindingsSecret .Values.telemetry.bindingCatalogSecret .Values.telemetry.readCredentialsSecret }}
{{- if and $secret (has $secret (list $database $token $tls)) }}{{ fail "commitment portfolio cannot share cloud or ingestion credential material" }}{{ end }}
{{- end }}
{{- range $replicas := list .Values.commitmentPortfolio.replicas .Values.commitmentPortfolio.modelReplicas }}
{{- if not (regexMatch "^[1-3]$" (toString $replicas)) }}{{ fail "commitment portfolio replicas must be between one and three" }}{{ end }}
{{- end }}
{{- if or (eq (len .Values.commitmentPortfolio.postgresEgressCidrs) 0) (gt (len .Values.commitmentPortfolio.postgresEgressCidrs) 16) }}{{ fail "commitment portfolio requires one to sixteen approved private database networks" }}{{ end }}
{{- $octet := "(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])" }}
{{- $cidr := printf "^%s([.]%s){3}/(1[6-9]|2[0-9]|3[0-2])$" $octet $octet }}
{{- range .Values.commitmentPortfolio.postgresEgressCidrs }}
{{- if or (not (regexMatch $cidr .)) (not (or (hasPrefix "10." .) (regexMatch "^172[.](1[6-9]|2[0-9]|3[01])[.]" .) (hasPrefix "192.168." .))) }}{{ fail "commitment portfolio requires bounded private IPv4 database networks" }}{{ end }}
{{- end }}
{{- $modelHost := printf "finops-commitment-portfolio-model.%s.svc.cluster.local" .Release.Namespace }}
{{- range $role := list "commitment-portfolio" "commitment-portfolio-model" }}
{{- $analyst := eq $role "commitment-portfolio" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-{{ $role }}
  labels: {finops-role: {{ $role }}}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-{{ $role }}
  labels: {finops-role: {{ $role }}}
spec:
  replicas: {{ if $analyst }}{{ $.Values.commitmentPortfolio.replicas }}{{ else }}{{ $.Values.commitmentPortfolio.modelReplicas }}{{ end }}
  selector:
    matchLabels: {finops-role: {{ $role }}}
  template:
    metadata:
      labels: {finops-role: {{ $role }}}
    spec:
      serviceAccountName: finops-{{ $role }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $role }}
          {{- if $analyst }}
          image: {{ include "finops.image" $.Values.images.backend | quote }}
          command: [/app/commitment-portfolio-worker]
          {{- else }}
          image: {{ include "finops.image" $.Values.images.economics | quote }}
          command: [python, -m, autopilot.portfolio_server]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          {{- if $analyst }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: COMMITMENT_PORTFOLIO_ENABLED, value: "true"}
            - {name: COMMITMENT_PORTFOLIO_TENANT_ID, value: {{ $.Values.commitmentPortfolio.tenantId | quote }}}
            - {name: COMMITMENT_PORTFOLIO_DATABASE_FILE, value: /run/secrets/commitment-portfolio-database}
            - {name: COMMITMENT_PORTFOLIO_DATABASE_MODE, value: HOSTED_TLS}
            - {name: COMMITMENT_PORTFOLIO_MODEL_URL, value: {{ printf "https://%s:443" $modelHost | quote }}}
            - {name: COMMITMENT_PORTFOLIO_MODEL_TOKEN_FILE, value: /run/secrets/commitment-portfolio-model-token}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20}
          {{- else }}
          ports: [{name: https, containerPort: 8443}]
          env:
            - {name: COMMITMENT_PORTFOLIO_MODEL_MODE, value: HOSTED_TLS}
          startupProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: https, scheme: HTTPS}, periodSeconds: 20}
          {{- end }}
          resources: {{ toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # Fixed regular-file subPath mounts; restart after secret rotation.
            - {name: model-token, mountPath: /run/secrets/commitment-portfolio-model-token, subPath: token, readOnly: true}
            {{- if $analyst }}
            - {name: database, mountPath: /run/secrets/commitment-portfolio-database, subPath: DATABASE_URL, readOnly: true}
            - {name: database-ca, mountPath: /run/ca/commitment-portfolio-root.crt, subPath: ca.crt, readOnly: true}
            - {name: model-ca, mountPath: /run/ca/commitment-portfolio-model-root.crt, subPath: ca.crt, readOnly: true}
            {{- else }}
            - {name: model-tls, mountPath: /run/tls/commitment-portfolio/tls.crt, subPath: tls.crt, readOnly: true}
            - {name: model-tls, mountPath: /run/tls/commitment-portfolio/tls.key, subPath: tls.key, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: model-token
          secret:
            secretName: {{ $token }}
            defaultMode: 288 # 0440
            items: [{key: token, path: token}]
        {{- if $analyst }}
        - name: database
          secret:
            secretName: {{ $database }}
            defaultMode: 288 # 0440
            items: [{key: DATABASE_URL, path: DATABASE_URL}]
        - name: database-ca
          configMap:
            name: {{ $databaseCA }}
            defaultMode: 292 # 0444
            items: [{key: ca.crt, path: ca.crt}]
        - name: model-ca
          configMap:
            name: {{ $modelCA }}
            defaultMode: 292 # 0444
            items: [{key: ca.crt, path: ca.crt}]
        {{- else }}
        - name: model-tls
          secret:
            secretName: {{ $tls }}
            defaultMode: 288 # 0440
            items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
        {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: finops-commitment-portfolio-model
spec:
  type: ClusterIP
  selector: {finops-role: commitment-portfolio-model}
  ports: [{name: https, port: 443, targetPort: https}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: finops-commitment-portfolio-egress}
spec:
  podSelector:
    matchLabels: {finops-role: commitment-portfolio}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        {{- range .Values.commitmentPortfolio.postgresEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels: {finops-role: commitment-portfolio-model}
      # Service443 targets actual TLS8443; both remain limited to this model pod.
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: finops-commitment-portfolio-model-ingress}
spec:
  podSelector:
    matchLabels: {finops-role: commitment-portfolio-model}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {finops-role: commitment-portfolio}
      ports: [{protocol: TCP, port: 8443}]
{{- end }}
