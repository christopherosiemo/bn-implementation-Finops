{{- if .Values.fleetCapacity.enabled }}
{{- if not .Values.telemetry.enabled }}{{ fail "fleet capacity requires the commissioned native telemetry reader" }}{{ end }}
{{- if and .Values.fleetAssessment.roleArn (eq .Values.fleetCapacity.roleArn .Values.fleetAssessment.roleArn) }}{{ fail "capacity and financial assessment require distinct IRSA identities" }}{{ end }}
{{- if not .Values.networkPolicy.enabled }}{{ fail "fleet capacity requires default-deny network policy" }}{{ end }}
{{- if ne .Values.dataMode "aws" }}{{ fail "hosted fleet capacity requires explicit AWS read-only mode" }}{{ end }}
{{- $_ := required "fleet capacity requires a commissioned tenant" .Values.aws.tenantId }}
{{- $_ := required "fleet capacity requires existing Ireland evidence storage" .Values.aws.rawBucket }}
{{- $_ := required "fleet capacity requires the reviewed RDS trust bundle" .Values.database.caConfigMap }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$" .Values.aws.tenantId) }}{{ fail "fleet capacity requires an exact tenant identifier" }}{{ end }}
{{- if not (regexMatch "^[0-9]{12}$" .Values.fleetCapacity.bucketOwner) }}{{ fail "fleet capacity requires the exact evidence bucket owner" }}{{ end }}
{{- if not (regexMatch "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$" .Values.fleetCapacity.roleArn) }}{{ fail "fleet capacity requires an exact dedicated IRSA role ARN" }}{{ end }}
{{- if has .Values.fleetCapacity.roleArn (list .Values.aws.readRoleArn .Values.aws.executionRoleArn .Values.hardware.roleArn .Values.fleetHistory.roleArn .Values.telemetry.readerRoleArn .Values.telemetry.ingressRoleArn) }}{{ fail "fleet capacity cannot reuse another service or customer IAM identity" }}{{ end }}
{{- range $key,$arn := .Values.aws }}{{ if and (hasSuffix "RoleArn" $key) (eq (toString $arn) $.Values.fleetCapacity.roleArn) }}{{ fail "fleet capacity cannot reuse any configured AWS role identity" }}{{ end }}{{ end }}
{{- $database := required "fleet capacity requires a distinct database login secret" (index .Values.database.secrets "fleet-capacity") }}
{{- if eq .Values.telemetry.readerTokenSecret .Values.secrets.economics }}{{ fail "fleet capacity requires distinct reader and model token secrets" }}{{ end }}
{{- range $token := list .Values.telemetry.readerTokenSecret .Values.secrets.economics }}
{{- if or (eq $token $database) (has $token (list $.Values.secrets.signer $.Values.secrets.executor $.Values.secrets.worker)) }}{{ fail "fleet capacity tokens cannot reuse database, signing or execution credential bundles" }}{{ end }}
{{- end }}
{{- if or (gt (len $database) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $database)) }}{{ fail "fleet capacity requires an exact existing database secret name" }}{{ end }}
{{- range $role,$secret := .Values.database.secrets }}{{ if and (ne $role "fleet-capacity") (eq $database $secret) }}{{ fail "fleet capacity cannot reuse another process database secret" }}{{ end }}{{ end }}
{{- range $name,$secret := .Values.secrets }}{{ if eq $database $secret }}{{ fail "fleet capacity database cannot share a service credential bundle" }}{{ end }}{{ end }}
{{- if not (regexMatch "^[1-3]$" (toString .Values.fleetCapacity.replicas)) }}{{ fail "fleet capacity replicas must be between one and three" }}{{ end }}
{{- if eq (len .Values.fleetCapacity.httpsEgressCidrs) 0 }}{{ fail "fleet capacity requires approved regional HTTPS destinations" }}{{ end }}
{{- if eq (len .Values.fleetCapacity.postgresEgressCidrs) 0 }}{{ fail "fleet capacity requires approved private RDS destinations" }}{{ end }}
{{- $octet := "(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])" }}
{{- $cidr := printf "^%s([.]%s){3}/([1-9]|[12][0-9]|3[0-2])$" $octet $octet }}
{{- range .Values.fleetCapacity.httpsEgressCidrs }}
{{- if or (not (regexMatch $cidr .)) (lt (int (last (splitList "/" .))) 16) (regexMatch "^(0[.]|127[.]|169[.]254[.]|2(2[4-9]|[3-5][0-9])[.])" .) }}{{ fail "fleet capacity HTTPS requires bounded approved IPv4 networks without metadata or loopback" }}{{ end }}
{{- end }}
{{- range .Values.fleetCapacity.postgresEgressCidrs }}
{{- if or (not (regexMatch $cidr .)) (lt (int (last (splitList "/" .))) 16) (not (or (hasPrefix "10." .) (regexMatch "^172[.](1[6-9]|2[0-9]|3[01])[.]" .) (hasPrefix "192.168." .))) }}{{ fail "fleet capacity RDS requires bounded reviewed private IPv4 networks" }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-fleet-capacity
  labels: {finops-role: fleet-capacity}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.fleetCapacity.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-fleet-capacity
  labels: {finops-role: fleet-capacity}
spec:
  replicas: {{ .Values.fleetCapacity.replicas }}
  selector:
    matchLabels: {finops-role: fleet-capacity}
  template:
    metadata:
      labels: {finops-role: fleet-capacity}
    spec:
      serviceAccountName: finops-fleet-capacity
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fleet-capacity
          image: {{ include "finops.image" .Values.images.backend | quote }}
          command: [/app/fleet-capacity-worker]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: FLEET_CAPACITY_ENABLED, value: "true"}
            - {name: FLEET_CAPACITY_TENANT_ID, value: {{ .Values.aws.tenantId | quote }}}
            - {name: FLEET_CAPACITY_DATABASE_FILE, value: /run/secrets/group-capacity-database}
            - {name: FLEET_CAPACITY_ARCHIVE_MODE, value: AWS_IRSA}
            - {name: FLEET_CAPACITY_ARCHIVE_REGION, value: eu-west-1}
            - {name: FLEET_CAPACITY_ARCHIVE_BUCKET, value: {{ .Values.aws.rawBucket | quote }}}
            - {name: FLEET_CAPACITY_ARCHIVE_BUCKET_OWNER, value: {{ .Values.fleetCapacity.bucketOwner | quote }}}
            - {name: FLEET_CAPACITY_SERVICE_MODE, value: PRIVATE_SERVICES}
            - {name: FLEET_CAPACITY_READER_URL, value: "http://finops-telemetry-reader:8080"}
            - {name: FLEET_CAPACITY_READER_TOKEN_FILE, value: /run/secrets/group-capacity-reader-token}
            - {name: FLEET_CAPACITY_MODEL_URL, value: "http://finops-economics:8000"}
            - {name: FLEET_CAPACITY_MODEL_TOKEN_FILE, value: /run/secrets/group-capacity-model-token}
            - {name: AWS_REGION, value: eu-west-1}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            # File mount avoids following projected-secret symlinks inside the
            # worker. Restart this optional deployment after DB secret rotation.
            - {name: database, mountPath: /run/secrets/group-capacity-database, subPath: DATABASE_URL, readOnly: true}
            - {name: rds-ca, mountPath: /etc/finops/rds, readOnly: true}
            - {name: reader-token, mountPath: /run/secrets/group-capacity-reader-token, subPath: TELEMETRY_READER_TOKEN, readOnly: true}
            - {name: model-token, mountPath: /run/secrets/group-capacity-model-token, subPath: ECONOMICS_TOKEN, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
        - name: database
          secret:
            secretName: {{ $database }}
            defaultMode: 0440
            items: [{key: DATABASE_URL, path: DATABASE_URL}]
        - name: reader-token
          secret:
            secretName: {{ required "fleet capacity requires the native reader token secret" .Values.telemetry.readerTokenSecret }}
            defaultMode: 0440
            items: [{key: TELEMETRY_READER_TOKEN, path: TELEMETRY_READER_TOKEN}]
        - name: model-token
          secret:
            secretName: {{ required "fleet capacity requires the model token secret" .Values.secrets.economics }}
            defaultMode: 0440
            items: [{key: ECONOMICS_TOKEN, path: ECONOMICS_TOKEN}]
        - name: rds-ca
          configMap: {name: {{ .Values.database.caConfigMap }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: finops-fleet-capacity-egress}
spec:
  podSelector:
    matchLabels: {finops-role: fleet-capacity}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        {{- range .Values.fleetCapacity.httpsEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    - to:
        {{- range .Values.fleetCapacity.postgresEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels: {finops-role: telemetry-reader}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - podSelector:
            matchLabels: {finops-role: economics}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: finops-fleet-capacity-model-ingress}
spec:
  podSelector:
    matchLabels: {finops-role: economics}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {finops-role: fleet-capacity}
      ports: [{protocol: TCP, port: 8000}]
{{- end }}
