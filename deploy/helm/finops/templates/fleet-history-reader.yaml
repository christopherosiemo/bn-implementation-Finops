{{- if .Values.fleetHistory.enabled }}
{{- if not .Values.networkPolicy.enabled }}{{ fail "fleet history reader requires default-deny network policy" }}{{ end }}
{{- if ne .Values.dataMode "aws" }}{{ fail "fleet history reader requires explicit AWS read-only mode" }}{{ end }}
{{- $_ := required "fleetHistory.roleArn requires a dedicated IRSA role" .Values.fleetHistory.roleArn }}
{{- $_ := required "fleetHistory.targetsSecret requires exact commissioned tenant and registration IDs" .Values.fleetHistory.targetsSecret }}
{{- $_ := required "fleetHistory.readBindingsSecret requires dedicated approved member read-role bindings" .Values.fleetHistory.readBindingsSecret }}
{{- $_ := required "aws.tenantId requires one commissioned tenant" .Values.aws.tenantId }}
{{- $_ := required "aws.rawBucket requires existing versioned Ireland evidence storage" .Values.aws.rawBucket }}
{{- $_ := required "database.caConfigMap requires the reviewed RDS trust bundle" .Values.database.caConfigMap }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$" .Values.aws.tenantId) }}{{ fail "fleet history reader requires an exact tenant identifier" }}{{ end }}
{{- if not (regexMatch "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$" .Values.fleetHistory.roleArn) }}{{ fail "fleet history reader requires an exact dedicated IRSA role ARN" }}{{ end }}
{{- if has .Values.fleetHistory.roleArn (list .Values.aws.readRoleArn .Values.aws.executionRoleArn .Values.aws.ingesterRoleArn .Values.aws.signerRoleArn .Values.aws.executorRoleArn .Values.telemetry.readerRoleArn .Values.telemetry.ingressRoleArn .Values.hardware.roleArn) }}{{ fail "fleet history reader cannot reuse another service or customer target IAM identity" }}{{ end }}
{{- range $key,$arn := .Values.aws }}{{ if and (hasSuffix "RoleArn" $key) (eq (toString $arn) $.Values.fleetHistory.roleArn) }}{{ fail "fleet history reader cannot reuse any configured AWS role identity" }}{{ end }}{{ end }}
{{- if and .Values.sources.readBindingsSecret (eq .Values.sources.readBindingsSecret .Values.fleetHistory.readBindingsSecret) }}{{ fail "fleet history reader requires its own approved read-binding secret" }}{{ end }}
{{- $database := required "database.secrets.fleet-history-reader requires a distinct ingestion login secret" (index .Values.database.secrets "fleet-history-reader") }}
{{- range $secret := list $database .Values.fleetHistory.targetsSecret .Values.fleetHistory.readBindingsSecret }}{{ if or (gt (len $secret) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$" $secret)) }}{{ fail "fleet history reader requires exact existing Kubernetes secret names" }}{{ end }}{{ end }}
{{- range $role,$secret := .Values.database.secrets }}{{ if and (ne $role "fleet-history-reader") (eq $database $secret) }}{{ fail "fleet history reader cannot reuse another process database secret" }}{{ end }}{{ end }}
{{- range $name,$secret := .Values.secrets }}{{ if eq $database $secret }}{{ fail "fleet history reader database cannot share another process credential bundle" }}{{ end }}{{ end }}
{{- if has $database (list .Values.fleetHistory.targetsSecret .Values.fleetHistory.readBindingsSecret) }}{{ fail "fleet history reader database and configuration secrets must be separate" }}{{ end }}
{{- if not (regexMatch "^[1-3]$" (toString .Values.fleetHistory.replicas)) }}{{ fail "fleet history reader replicas must be between one and three" }}{{ end }}
{{- $endpoint := default "https://s3.eu-west-1.amazonaws.com" .Values.objectStorage.endpoint }}
{{- if not (regexMatch "^https://(s3[.]eu-west-1[.]amazonaws[.]com|[a-z0-9.-]+[.]s3[.]eu-west-1[.]vpce[.]amazonaws[.]com)/?$" $endpoint) }}{{ fail "fleet history reader evidence endpoint must be regional Ireland HTTPS S3" }}{{ end }}
{{- if eq (len .Values.fleetHistory.httpsEgressCidrs) 0 }}{{ fail "fleet history reader requires approved regional HTTPS networks" }}{{ end }}
{{- if eq (len .Values.fleetHistory.postgresEgressCidrs) 0 }}{{ fail "fleet history reader requires approved private RDS destination networks" }}{{ end }}
{{- $octet := "(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])" }}
{{- $cidr := printf "^%s([.]%s){3}/([1-9]|[12][0-9]|3[0-2])$" $octet $octet }}
{{- range .Values.fleetHistory.httpsEgressCidrs }}
{{- if or (not (regexMatch $cidr .)) (lt (int (last (splitList "/" .))) 16) (regexMatch "^(0[.]|127[.]|169[.]254[.]|2(2[4-9]|[3-5][0-9])[.])" .) }}{{ fail "fleet history reader HTTPS requires bounded approved IPv4 networks (/16 or narrower), without loopback or metadata" }}{{ end }}
{{- end }}
{{- range .Values.fleetHistory.postgresEgressCidrs }}
{{- $prefix := int (last (splitList "/" .)) }}
{{- if or (not (regexMatch $cidr .)) (lt $prefix 16) (not (or (hasPrefix "10." .) (regexMatch "^172[.](1[6-9]|2[0-9]|3[01])[.]" .) (hasPrefix "192.168." .))) }}{{ fail "fleet history reader RDS egress requires exact reviewed private IPv4 networks (/16 or narrower)" }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-fleet-history-reader
  labels: {finops-role: fleet-history-reader}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.fleetHistory.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-fleet-history-reader
  labels: {finops-role: fleet-history-reader}
spec:
  replicas: {{ .Values.fleetHistory.replicas }}
  selector:
    matchLabels: {finops-role: fleet-history-reader}
  template:
    metadata:
      labels: {finops-role: fleet-history-reader}
    spec:
      serviceAccountName: finops-fleet-history-reader
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fleet-history-reader
          image: {{ include "finops.image" .Values.images.backend | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: APP_ROLE, value: fleet-history-reader}
            - {name: PORT, value: "8080"}
            - {name: DATA_MODE, value: aws}
            - {name: FIXTURE_MODE, value: "false"}
            - {name: AWS_REGION, value: eu-west-1}
            - {name: AWS_TENANT_ID, value: {{ .Values.aws.tenantId | quote }}}
            - {name: AWS_STS_REGIONAL_ENDPOINTS, value: regional}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ index .Values.database.secrets "fleet-history-reader" }}, key: DATABASE_URL}
            - name: AWS_SOURCE_READ_BINDINGS_JSON
              valueFrom:
                secretKeyRef: {name: {{ .Values.fleetHistory.readBindingsSecret }}, key: AWS_SOURCE_READ_BINDINGS_JSON}
            - name: AWS_FLEET_HISTORY_REGISTRATIONS_JSON
              valueFrom:
                secretKeyRef: {name: {{ .Values.fleetHistory.targetsSecret }}, key: AWS_FLEET_HISTORY_REGISTRATIONS_JSON}
            - {name: OBJECT_REGION, value: eu-west-1}
            - {name: OBJECT_ENDPOINT, value: {{ $endpoint | quote }}}
            - {name: OBJECT_BUCKET_RAW, value: {{ .Values.aws.rawBucket | quote }}}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: rds-ca, mountPath: /etc/finops/rds, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: rds-ca
          configMap: {name: {{ .Values.database.caConfigMap }}}
---
apiVersion: v1
kind: Service
metadata: {name: finops-fleet-history-reader}
spec:
  type: ClusterIP
  selector: {finops-role: fleet-history-reader}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: finops-fleet-history-reader-egress}
spec:
  podSelector:
    matchLabels: {finops-role: fleet-history-reader}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        {{- range .Values.fleetHistory.postgresEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        {{- range .Values.fleetHistory.httpsEgressCidrs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
{{- end }}
