{{- if not (has .Values.dataMode (list "fixture" "aws")) }}{{ fail "dataMode must be fixture or aws" }}{{ end }}
{{- if ne .Values.aws.region "eu-west-1" }}{{ fail "This pilot is restricted to AWS eu-west-1" }}{{ end }}
{{- if and .Values.notifications.webhookUrl (not (hasPrefix "https://" .Values.notifications.webhookUrl)) }}{{ fail "notifications.webhookUrl must use HTTPS" }}{{ end }}
{{- if eq .Values.dataMode "aws" }}
{{- $_ := required "aws.tenantId must bind this live pilot to exactly one customer" .Values.aws.tenantId }}
{{- $_ := required "aws.readRoleArn required for AWS mode" .Values.aws.readRoleArn }}
{{- $_ := required "aws.ingesterRoleArn IRSA role required for AWS mode" .Values.aws.ingesterRoleArn }}
{{- $_ := required "aws.rawBucket required for AWS mode" .Values.aws.rawBucket }}
{{- $_ := required "aws.auditBucket required for AWS mode" .Values.aws.auditBucket }}
{{- if .Values.aws.executionRoleArn }}
{{- $_ := required "aws.executorRoleArn IRSA role required when AWS execution is configured" .Values.aws.executorRoleArn }}
{{- if eq .Values.health.allowedHosts "" }}{{ fail "health.allowedHosts must list exact HTTPS health hostnames when AWS execution is configured" }}{{ end }}
{{- end }}
{{- end }}
{{- range $role := list "api" "worker" "ingester" "signer" "executor" "economics" "web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-{{ $role }}
  labels:
    {{- include "finops.labels" $ | nindent 4 }}
    finops-role: {{ $role }}
  {{- $arn := index $.Values.aws (printf "%sRoleArn" $role) }}
  {{- if $arn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $arn | quote }}
  {{- end }}
# IRSA mutating webhook mounts the audience-scoped AWS token for these roles.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-{{ $role }}
  labels:
    {{- include "finops.labels" $ | nindent 4 }}
    finops-role: {{ $role }}
spec:
  replicas: {{ index $.Values.replicas $role }}
  selector:
    matchLabels: { finops-role: {{ $role }} }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- include "finops.labels" $ | nindent 8 }}
        finops-role: {{ $role }}
    spec:
      serviceAccountName: finops-{{ $role }}
      terminationGracePeriodSeconds: 60
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ if eq $role "web" }}101{{ else }}10001{{ end }}
        fsGroup: {{ if eq $role "web" }}101{{ else }}10001{{ end }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $role }}
          {{- $image := $.Values.images.backend }}
          {{- if eq $role "economics" }}{{ $image = $.Values.images.economics }}{{ end }}
          {{- if eq $role "web" }}{{ $image = $.Values.images.web }}{{ end }}
          image: {{ include "finops.image" $image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ if eq $role "web" }}{{ $.Values.web.readOnlyRootFilesystem }}{{ else }}true{{ end }}
            capabilities: { drop: [ALL] }
          ports:
            - name: http
              containerPort: {{ if eq $role "economics" }}8000{{ else if eq $role "web" }}{{ $.Values.web.containerPort }}{{ else }}8080{{ end }}
          env:
            - { name: AWS_REGION, value: {{ $.Values.aws.region | quote }} }
            - { name: AWS_TENANT_ID, value: {{ $.Values.aws.tenantId | quote }} }
            - { name: AWS_STS_REGIONAL_ENDPOINTS, value: regional }
            - { name: DATA_MODE, value: {{ $.Values.dataMode | quote }} }
            - { name: FIXTURE_MODE, value: {{ eq $.Values.dataMode "fixture" | quote }} }
            {{- if has $role (list "api" "worker" "ingester" "signer" "executor") }}
            - { name: APP_ROLE, value: {{ $role | quote }} }
            - { name: PORT, value: "8080" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ index $.Values.database.secrets $role }}, key: DATABASE_URL }
            - { name: TEMPORAL_ADDRESS, value: {{ include "finops.temporal" $ | quote }} }
            - { name: TEMPORAL_NAMESPACE, value: {{ $.Values.temporal.namespace | quote }} }
            - { name: ECONOMICS_URL, value: "http://finops-economics:8000" }
            - { name: OIDC_ISSUER, value: {{ $.Values.oidc.issuer | quote }} }
            - { name: OIDC_AUDIENCE, value: {{ $.Values.oidc.audience | quote }} }
            {{- if $.Values.oidc.jwksUrl }}
            - { name: OIDC_JWKS_URL, value: {{ $.Values.oidc.jwksUrl | quote }} }
            {{- end }}
            {{- end }}
            {{- if eq $role "worker" }}
            - { name: SIGNER_URL, value: "http://finops-signer:8080" }
            - { name: EXECUTOR_URL, value: "http://finops-executor:8080" }
            {{- if $.Values.notifications.webhookUrl }}
            - { name: WEBHOOK_URL, value: {{ $.Values.notifications.webhookUrl | quote }} }
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secrets.worker }}, key: WEBHOOK_SECRET }
            {{- end }}
            {{- end }}
            {{- if eq $role "ingester" }}
            - { name: AWS_READ_ROLE_ARN, value: {{ $.Values.aws.readRoleArn | quote }} }
            - { name: OBJECT_ENDPOINT, value: {{ $.Values.objectStorage.endpoint | quote }} }
            - { name: OBJECT_REGION, value: {{ $.Values.aws.region | quote }} }
            - { name: OBJECT_BUCKET_RAW, value: {{ $.Values.aws.rawBucket | quote }} }
            - { name: OBJECT_BUCKET_AUDIT, value: {{ $.Values.aws.auditBucket | quote }} }
            - { name: CLICKHOUSE_URL, value: {{ include "finops.clickhouse" $ | quote }} }
            - { name: CLICKHOUSE_DATABASE, value: {{ $.Values.clickhouseCredentials.database | quote }} }
            - { name: CLICKHOUSE_USER, value: {{ $.Values.clickhouseCredentials.username | quote }} }
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secrets.clickhouse }}, key: password }
            {{- end }}
            {{- if eq $role "executor" }}
            - { name: AWS_EXECUTION_ROLE_ARN, value: {{ $.Values.aws.executionRoleArn | quote }} }
            - { name: HEALTH_ALLOWED_HOSTS, value: {{ $.Values.health.allowedHosts | quote }} }
            {{- end }}
            {{- if has $role (list "api" "ingester" "economics") }}
            - name: ECONOMICS_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secrets.economics }}, key: ECONOMICS_TOKEN }
            {{- end }}
            {{- if and (eq $.Values.dataMode "aws") (has $role (list "ingester" "executor")) }}
            - name: AWS_EXTERNAL_ID
              valueFrom:
                secretKeyRef: { name: {{ $.Values.aws.externalIdSecret }}, key: AWS_EXTERNAL_ID }
            {{- end }}
            {{- if has $role (list "worker" "signer" "executor") }}
            {{- $secret := index $.Values.secrets $role }}
            {{- $keys := list "SIGNING_PUBLIC_KEY" }}
            {{- if eq $role "worker" }}{{ $keys = list "SIGNING_PUBLIC_KEY" "SIGNER_TOKEN" "EXECUTOR_TOKEN" }}{{ end }}
            {{- if eq $role "signer" }}{{ $keys = list "SIGNING_PRIVATE_KEY" "SIGNER_TOKEN" }}{{ end }}
            {{- if eq $role "executor" }}{{ $keys = list "SIGNING_PUBLIC_KEY" "EXECUTOR_TOKEN" }}{{ end }}
            {{- range $key := $keys }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: { name: {{ $secret }}, key: {{ $key }} }
            {{- end }}
            {{- end }}
            {{- if eq $role "economics" }}
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            {{- end }}
            {{- if eq $role "web" }}
            - { name: API_UPSTREAM, value: "finops-api.{{ $.Release.Namespace }}.svc.cluster.local:8080" }
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{ toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if has $role (list "api" "worker" "ingester" "signer" "executor") }}
            - { name: rds-ca, mountPath: /etc/finops/rds, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
        {{- if has $role (list "api" "worker" "ingester" "signer" "executor") }}
        - name: rds-ca
          configMap: { name: {{ $.Values.database.caConfigMap }} }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: finops-{{ $role }}
  labels:
    {{- include "finops.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector: { finops-role: {{ $role }} }
  ports:
    - name: http
      port: {{ if eq $role "economics" }}8000{{ else if eq $role "web" }}80{{ else }}8080{{ end }}
      targetPort: http
{{- end }}
