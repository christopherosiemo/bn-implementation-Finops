            work/private/group-fixture-commission/*/browser/results/**/test-failed-*.png
            work/private/group-fixture-program-review/*/results/**/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise isolated provisional multicloud publication with actual local storage
        run: |
          node --test scripts/tests/multicloud-publication-lab.test.mjs
          node scripts/multicloud-publication-lab.mjs
      - name: Exercise isolated encrypted Terraform artifact capture with actual local tools
        run: |
          node --test scripts/tests/fixture-go-modules.test.mjs scripts/tests/configuration-artifact-lab.test.mjs
          node scripts/configuration-artifact-lab.mjs
      - name: Exercise private native historical-rate broker with isolated PostgreSQL
        run: |
          node --test scripts/tests/fleet-billing-price-lab.test.mjs
          node scripts/fleet-billing-price-lab.mjs
      - name: Exercise fleet history with actual isolated PostgreSQL and versioned objects
        run: |
          node --test scripts/tests/fleet-history-lab.test.mjs
          node scripts/fleet-history-lab.mjs
      - name: Preserve bounded history acceptance without credentials or source bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-history-storage-acceptance
          path: work/private/fleet-history/*/acceptance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise private hardware identity derivation with actual isolated storage
        run: |
          node --test scripts/tests/hardware-identity-lab.test.mjs
          node scripts/hardware-identity-lab.mjs
      - name: Preserve bounded identity acceptance without credentials or native bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-identity-storage-acceptance
          path: work/private/hardware-identity/*/acceptance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify final encrypted whole-cluster PostgreSQL backup in network quarantine
        run: node scripts/postgres-recovery-lab.mjs
      - name: Collect service diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop fixture containers
        if: always()
        run: docker compose down --volumes --remove-orphans
