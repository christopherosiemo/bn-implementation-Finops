name: Fleet private protocol acceptance
on:
  workflow_dispatch:
    inputs:
      policy:
        description: Explicit signed protocol policy;120s variant earns no default-duration acceptance
        type: choice
        default: DEFAULT
        options: [DEFAULT, TEST_POLICY_120S]
permissions:
  contents: read
jobs:
  real-clock-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: fleet_protocol_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated default or explicitly labelled test-policy protocol
        env:
          REQUESTED_POLICY: ${{ inputs.policy }}
        run: |
          set -euo pipefail
          case "$REQUESTED_POLICY" in
            DEFAULT) flag=TEST_FLEET_FULL_PROGRAM; test=TestFleetFullProgramRealClockControlledDrain ;;
            TEST_POLICY_120S) flag=TEST_FLEET_TEST_POLICY; test=TestFleetFullProgramRealClockTestPolicy ;;
            *) exit 2 ;;
          esac
          mkdir -p work
          docker run --rm --network host -e TEST_DATABASE_URL=postgres://postgres:ephemeral-ci-only@127.0.0.1:5432/fleet_protocol_ci?sslmode=disable -e "$flag=true" -v "$PWD:/workspace" -w /workspace golang:1.27.3-bookworm@sha256:32fa283222e2905d9fee971f60c842e5c815fdc036cf7ea599bf36bd7ca8f67f go test ./internal/service -run "^$test$" -count=1 -v -timeout=235m 2>&1 | tee work/fleet-protocol-acceptance.log
      - name: Preserve real-clock private protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-private-protocol-${{ inputs.policy }}-${{ github.sha }}
          path: work/fleet-protocol-acceptance.log
          retention-days: 5
