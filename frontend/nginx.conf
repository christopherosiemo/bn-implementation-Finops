server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
    resolver_timeout 3s;
    set $api_origin http://${API_UPSTREAM};
    location /v1/ {
        # Go authenticates before enforcing its 4 MiB body limit. Keep the
        # proxy allowance bounded but larger so that API boundary is reachable.
        # Bodies over 5 MiB are rejected here before API authentication.
        client_max_body_size 5m;
        error_page 413 = @mutation_body_too_large;
        proxy_pass $api_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @mutation_body_too_large {
        internal;
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        return 413 '{"error":"BODY_TOO_LARGE","message":"request body exceeds 4 MiB"}';
    }
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location / { try_files $uri $uri/ /index.html; }
}
