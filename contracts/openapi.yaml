      required: [status, reason_codes]
      properties:
        id: { type: string }
        evaluation_hash: { type: string }
        status: { type: string, enum: [CLEAR, BLOCKED] }
        reason_codes: { type: array, items: { type: string } }
        objective_id: { type: string }
        objective_version: { type: integer, minimum: 0 }
        objective_hash: { type: string }
        source_id: { type: string }
        source_hash: { type: string }
        resource_id: { type: string }
        workload_id: { type: string }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        expected_intervals: { type: integer, minimum: 0 }
        observed_intervals: { type: integer, minimum: 0 }
        coverage_ppm: { type: integer, minimum: 0, maximum: 1000000 }
        request_count: { type: integer, minimum: 0 }
        error_count: { type: integer, minimum: 0 }
        availability_good_seconds: { type: integer, minimum: 0 }
        availability_total_seconds: { type: integer, minimum: 0 }
        error_rate_ppm: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }
        availability_ppm: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }
        latency_samples: { type: integer, minimum: 0 }
        p95_latency_ms: { type: integer, nullable: true, minimum: 0, description: Histogram upper bound; unavailable for no demand or insufficient observations }
        p99_latency_ms: { type: integer, nullable: true, minimum: 0 }
        p95_lower_ms: { type: integer, nullable: true, minimum: 0 }
        p99_lower_ms: { type: integer, nullable: true, minimum: 0 }
        latency_status: { type: string, enum: [OBSERVED, NO_DEMAND, INSUFFICIENT] }
        hard_checks: { type: array, items: { $ref: '#/components/schemas/SloCheck' } }
        regression_checks: { type: array, items: { $ref: '#/components/schemas/SloCheck' } }
        receipt_ids: { type: array, items: { type: string } }
        baseline_evaluation_id: { type: string }
        baseline_evaluation_hash: { type: string }
    SloHistogramBucket:
      type: object
      additionalProperties: false
      required: [upper_bound_ms, count]
      properties:
        upper_bound_ms: { type: integer, nullable: true, minimum: 0, maximum: 86400000, description: Strictly increasing finite millisecond bounds; the last bucket alone has null for positive infinity }
        count: { type: integer, minimum: 0, maximum: 1000000000000, description: Non-cumulative bucket count }
    SloHistogram:
      type: object
      additionalProperties: false
      required: [unit, buckets, sample_count]
      properties:
        unit: { type: string, enum: [milliseconds] }
        buckets: { type: array, minItems: 1, maxItems: 256, items: { $ref: '#/components/schemas/SloHistogramBucket' } }
        sample_count: { type: integer, minimum: 0, maximum: 1000000000000, description: Equals request_count and the sum of all non-cumulative bucket counts }
    SloInterval:
      type: object
