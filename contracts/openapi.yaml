openapi: 3.0.3
info:
  title: Cloud Cost Autopilot AWS Pilot
  version: 0.3.0
  description: Tenant identity comes exclusively from the validated OIDC token. Monetary values are decimal strings. All POSTs require Idempotency-Key; resource updates also require If-Match. Control-plane POST bodies are limited to 4 MiB (4194304 bytes) including whitespace; larger complete or streamed bodies return 413 BODY_TOO_LARGE before idempotency or database access. Dedicated machine ingress retains its separate limits.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /aws-service-assessments:
    get:
      operationId: listAWSServiceAssessments
      parameters:
        - { name: resource_id, in: query, schema: { type: string } }
        - { name: family, in: query, schema: { type: string, enum: [ECS, DYNAMODB, ELASTICACHE, ELB] } }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Tenant and workload-scoped immutable read-only assessment history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AWSServiceAssessmentPage' }
        '403': { description: Workload scope denied. }
    post:
      operationId: requestAWSServiceAssessment
      description: IDs-only asynchronous assessment. Evidence, safety profile, customer rates and source versions are selected by the server. EKS uses the existing Kubernetes optimiser.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AWSServiceAssessmentRequest' }
      responses:
        '202':
          description: Queued read-only analysis. No execution permission or savings claim.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AWSServiceAssessmentRecord' }
        '422': { description: IDs-only request or supported stable resource required. }
  /aws-service-assessments/{id}:
    get:
      operationId: getAWSServiceAssessment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Persisted assessment with currentness blockers; history is retained after corrections.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AWSServiceAssessmentRecord' }
        '404': { description: Assessment unavailable in this tenant/workload scope. }
  /resources/{id}/aws-service-evidence:
    get:
      operationId: getAWSServiceEvidence
      description: Scoped immutable native evidence for a discovered AWS service resource. Discovery establishes observation coverage, never execution authority or verified savings.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Latest native snapshot and current source-binding metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AWSServiceEvidence' }
        '403': { description: Workload scope denied. }
        '404': { description: Resource or evidence unavailable. }
  /resources:
    get:
      operationId: listResources
      parameters:
        - name: resource_type
          in: query
          schema: { $ref: '#/components/schemas/AssessmentResourceKind' }
        - name: service_family
          in: query
          schema: { $ref: '#/components/schemas/AWSServiceFamily' }
        - name: workload_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Existing resource array or paginated native database, block-storage and S3 bucket resources when resource_type is selected.
          content:
            application/json:
              schema:
                oneOf:
                  - { type: array, items: { $ref: '#/components/schemas/Resource' } }
                  - { $ref: '#/components/schemas/DatabaseResourcePage' }
        '403': { description: Resource scope denied. }
  /database-assessments:
    get:
      operationId: listDatabaseAssessments
      parameters:
        - name: resource_id
          in: query
          description: Exact resource filter. Required for a scoped application owner; other permitted roles may read tenant-wide history.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Tenant-scoped persisted database assessment history; no execution authority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseAssessmentPage' }
        '403': { description: Scoped database read permission required. }
    post:
      operationId: requestDatabaseAssessment
      description: IDs-only read-only assessment. Server resolves native inventory, metrics and economics. If-Match must be quoted zero; no prices, metrics, configurations or authority are accepted from the caller.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatabaseAssessmentRequest' }
      responses:
        '202':
          description: Persisted queued request; all proposals remain non-executable R3 advice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseAssessmentRecord' }
        '403': { description: Scoped assessment write permission required. }
        '409': { description: Idempotency conflict. }
        '412': { description: Initial version precondition failed. }
        '422': { description: Resource is absent, unsupported or outside the authenticated scope. }
  /database-assessments/{id}:
    get:
      operationId: getDatabaseAssessment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Immutable database assessment and its source-bound evidence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatabaseAssessmentRecord' }
        '403': { description: Scoped database read permission required. }
        '404': { description: Scoped assessment absent. }
  /storage-assessments:
    get:
      operationId: listStorageAssessments
      parameters:
        - name: resource_id
          in: query
          description: Exact resource filter. Required for a scoped application owner; other permitted roles may read tenant-wide history.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Tenant-scoped persisted storage assessment history; no mutation or execution authority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageAssessmentPage' }
        '403': { description: Scoped storage read permission required. }
    post:
      operationId: requestStorageAssessment
      description: IDs-only read-only EBS assessment. Server resolves native inventory, telemetry, dependencies and customer economics. If-Match must be quoted zero. No amounts, observations, configuration or authority are accepted from the caller.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageAssessmentRequest' }
      responses:
        '202':
          description: Persisted queued assessment; all proposals remain non-executable R3 advice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageAssessmentRecord' }
        '403': { description: Scoped assessment write permission required. }
        '409': { description: Idempotency conflict. }
        '412': { description: Initial version precondition failed. }
        '422': { description: Resource is absent, unsupported or outside the authenticated scope. }
  /storage-assessments/{id}:
    get:
      operationId: getStorageAssessment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Immutable storage assessment and source-bound evidence, annotated with server-derived currentness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageAssessmentRecord' }
        '403': { description: Scoped storage read permission required. }
        '404': { description: Scoped assessment absent. }
  /lambda-performance/batches:
    post:
      operationId: ingestLambdaPerformance
      description: Dedicated machine ingress only. Requires a separately registered issuer, single dedicated audience and exact subject; human console tokens are refused. Historical benchmarks retain their actual receipt time and cannot mint activity or SLO history. Optional and disabled by default.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LambdaPerformanceBatch' }
      responses:
        '201':
          description: Immutable source-bound performance receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageAssessmentObject' }
        '401': { description: Dedicated machine identity required. }
        '403': { description: Registered tenant, function, qualifier and source subject required. }
        '409': { description: Conflicting sequence, idempotency key or body hash. }
        '422': { description: Invalid or incompatible performance evidence. }
  /lambda-assessments:
    get:
      operationId: listLambdaAssessments
      parameters:
        - { name: resource_id, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Tenant and workload scoped immutable Lambda assessments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LambdaAssessmentPage' }
    post:
      operationId: requestLambdaAssessment
      description: Select a discovered function and serving qualifier. Native observations, rates and source revisions are selected by the server.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LambdaAssessmentRequest' }
      responses:
        '202':
          description: Read-only assessment queued. No function mutation or verified saving is authorized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LambdaAssessmentRecord' }
  /lambda-assessments/{id}:
    get:
      operationId: getLambdaAssessment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Immutable result with server-derived currentness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LambdaAssessmentRecord' }
  /lambda-policies:
    get:
      operationId: listLambdaPolicies
      parameters:
        - { name: resource_id, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Scoped latest immutable customer requirement revisions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LambdaPolicyPage' }
    post:
      operationId: createLambdaPolicy
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LambdaPolicyRequest' }
      responses:
        '201':
          description: Requirements recorded; declarations establish no telemetry, pricing or execution authority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LambdaPolicy' }
  /lambda-policies/{id}:
    get:
      operationId: getLambdaPolicy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Latest scoped requirement revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LambdaPolicy' }
  /lambda-policies/{id}/revisions:
    post:
      operationId: reviseLambdaPolicy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LambdaPolicyRequest' }
      responses:
        '201':
          description: New immutable requirements revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LambdaPolicy' }
  /network-assessments:
    get:
      operationId: listNetworkAssessments
      description: Tenant and workload scoped, cursor-paginated read-only network records.
      parameters:
        - name: resource_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Scoped records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkAssessmentPage' }
        '403': { description: Scoped network permission required. }
    post:
      operationId: requestNetworkAssessment
      description: IDs-only read-only request. Server selects current topology, native metrics, commissioned Flow Logs and customer economics. If-Match is quoted zero. No observations, monetary amounts or execution authority are accepted.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkAssessmentRequest' }
      responses:
        '202':
          description: Persisted versioned record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkAssessmentRecord' }
        '403': { description: Scoped write permission required. }
        '409': { description: Idempotency conflict. }
        '412': { description: Resource version changed. }
        '422': { description: Invalid or unauthorised identifier or declaration. }
  /network-assessments/{id}:
    get:
      operationId: getNetworkAssessment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Scoped immutable network record and server-derived currentness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkAssessmentRecord' }
        '403': { description: Scoped network permission required. }
        '404': { description: Scoped record absent. }
  /network-policies:
    get:
      operationId: listNetworkPolicies
      description: Tenant and workload scoped, cursor-paginated read-only network records.
      parameters:
        - name: resource_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Scoped records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkPolicyPage' }
        '403': { description: Scoped network permission required. }
    post:
      operationId: createNetworkPolicy
      description: Customer business and network constraints only. Declarations do not establish native topology, traffic completeness or financial truth.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkPolicyRequest' }
      responses:
        '201':
          description: Persisted versioned record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkPolicy' }
        '403': { description: Scoped write permission required. }
        '409': { description: Idempotency conflict. }
        '412': { description: Resource version changed. }
        '422': { description: Invalid or unauthorised identifier or declaration. }
  /network-policies/{id}:
    get:
      operationId: getNetworkPolicy
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Scoped immutable network record and server-derived currentness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkPolicy' }
        '403': { description: Scoped network permission required. }
        '404': { description: Scoped record absent. }
  /network-policies/{id}/revisions:
    post:
      operationId: reviseNetworkPolicy
      description: Append a business-policy revision. Existing assessments remain immutable and become stale when their policy changes.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkPolicyRequest' }
      responses:
        '201':
          description: Persisted versioned record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkPolicy' }
        '403': { description: Scoped write permission required. }
        '409': { description: Idempotency conflict. }
        '412': { description: Resource version changed. }
        '422': { description: Invalid or unauthorised identifier or declaration. }
  /object-storage-datasets:
    get:
      operationId: listObjectStorageDatasets
      description: Tenant- and workload-scoped dataset declarations. These select populations and declare customer requirements; they cannot supply native observations or authoritative financial evidence.
      parameters:
        - name: resource_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Cursor-paginated current dataset declarations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageDatasetPage' }
        '403': { description: Dataset scope denied. }
    post:
      operationId: createObjectStorageDataset
      description: Declare a dataset and customer requirements for an existing discovered S3 bucket. If-Match must be quoted zero. Declared requirements are not observations, access evidence or execution authority.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectStorageDatasetRequest' }
      responses:
        '201':
          description: Immutable first dataset revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageDataset' }
        '403': { description: Dataset declaration scope denied. }
        '409': { description: Idempotency conflict. }
        '412': { description: Initial version precondition failed. }
        '422': { description: Invalid selection or customer requirements. }
  /object-storage-datasets/{id}:
    get:
      operationId: getObjectStorageDataset
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Current immutable dataset declaration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageDataset' }
        '403': { description: Dataset scope denied. }
        '404': { description: Scoped dataset absent. }
  /object-storage-datasets/{id}/revisions:
    post:
      operationId: reviseObjectStorageDataset
      description: Append a dataset declaration revision. If-Match binds the current dataset version; historical declarations and assessments remain immutable.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectStorageDatasetRequest' }
      responses:
        '201':
          description: Appended immutable dataset revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageDataset' }
        '403': { description: Dataset declaration scope denied. }
        '409': { description: Idempotency conflict. }
        '412': { description: Dataset version changed. }
        '422': { description: Invalid selection or customer requirements. }
  /object-storage-assessments:
    get:
      operationId: listObjectStorageAssessments
      parameters:
        - name: resource_id
          in: query
          description: Exact bucket resource filter; required for a scoped application owner.
          schema: { type: string }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Tenant-scoped immutable S3 assessment history with currentness checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageAssessmentPage' }
        '403': { description: Bucket or workload read scope denied. }
    post:
      operationId: requestObjectStorageAssessment
      description: IDs-only queued read-only S3 assessment. Server selects immutable inventory, population, access, lifecycle, policy and billing evidence. If-Match must be quoted zero. Caller amounts or observations are rejected.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectStorageAssessmentRequest' }
      responses:
        '202':
          description: Queued assessment; no object or lifecycle mutation authority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageAssessmentRecord' }
        '403': { description: Bucket or workload assessment scope denied. }
        '409': { description: Idempotency conflict. }
        '412': { description: Initial version precondition failed. }
        '422': { description: Invalid resource, dataset or evidence binding. }
  /object-storage-assessments/{id}:
    get:
      operationId: getObjectStorageAssessment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Immutable object-storage assessment annotated with current source and declaration validity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageAssessmentRecord' }
        '403': { description: Bucket or workload read scope denied. }
        '404': { description: Scoped assessment absent. }
  /object-storage-access-sources:
    get:
      operationId: listObjectStorageAccessSources
      parameters:
        - name: resource_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Scoped registered machine collectors; registration does not establish observed access coverage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageAccessSourcePage' }
        '403': { description: Collector scope denied. }
    post:
      operationId: registerObjectStorageAccessSource
      description: PLATFORM_ADMIN registers an independent machine OIDC subject and versioned metric definition for an issued dataset. If-Match must be quoted zero. This is an explicit customer scope declaration, not native proof of all bucket reads. Console identities cannot publish access observations.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectStorageAccessSourceRequest' }
      responses:
        '201':
          description: Registered independent collector; historical access remains unknown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageAccessSource' }
        '403': { description: Platform administration required. }
        '422': { description: Invalid dataset, definition or subject binding. }
  /object-storage-access-sources/{id}:
    get:
      operationId: getObjectStorageAccessSource
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Immutable collector registration plus server-selected revocation state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageAccessSource' }
        '403': { description: Collector scope denied. }
        '404': { description: Scoped collector absent. }
  /object-storage-access-sources/{id}/revoke:
    post:
      operationId: revokeObjectStorageAccessSource
      description: Append revocation without rewriting registration or accepted observations. If-Match binds the current source version.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Collector revoked; retained historical evidence is unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageAccessSource' }
        '403': { description: Platform administration required. }
        '412': { description: Source version changed. }
  /object-storage-access/intervals:
    post:
      operationId: ingestObjectStorageAccessInterval
      description: Dedicated activity-ingress service only. Requires its configured machine OIDC audience and exact registered issuer/subject. Complete one-minute intervals must arrive within five minutes; historical backfill, console tokens, conflicting replays and changed dataset versions are rejected. An explicit zero is distinct from a missing interval.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObjectStorageAccessInterval' }
      responses:
        '201':
          description: Append-only receipt of independently authenticated current activity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageAccessIntervalResult' }
        '200':
          description: Exact replay of a previously accepted interval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObjectStorageAccessIntervalResult' }
        '401': { description: Registered machine authentication required. }
        '403': { description: Machine identity, dataset or tenant binding denied. }
        '409': { description: Sequence, replay or body conflict. }
        '422': { description: Incomplete, stale, future or invalid interval. }
  /coverage:
    get:
      operationId: getAssessmentCoverage
      responses:
        '200':
          description: All-AWS positive billed-charge denominator, separated by currency. Credits are shown separately; unknown or zero denominators have null analysed_percent. Coverage is not a savings or execution claim.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssessmentCoverage' }
        '403': { description: Tenant financial read permission required. }
  /commitment-decision-inputs/{id}:
    get:
      operationId: getCommitmentDecisionPreparation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Immutable evidence-preparation request and issued result IDs or explicit gaps.
          content:
