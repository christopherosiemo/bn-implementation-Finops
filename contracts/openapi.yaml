          nullable: true
          allOf: [ { $ref: '#/components/schemas/SloObjective' } ]
        source:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/SloSource' } ]
        evaluation: { $ref: '#/components/schemas/SloEvaluation' }
        snapshot_id: { type: string }
        snapshot_hash: { type: string }
