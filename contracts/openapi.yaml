      properties:
        version: { type: integer, minimum: 0 }
        nodes: { type: array, items: { $ref: '#/components/schemas/DependencyNode' } }
        edges: { type: array, items: { $ref: '#/components/schemas/DependencyEdge' } }
        inventory_hash: { type: string }
        graph_hash: { type: string }
        status: { type: string, enum: [UNKNOWN, DECLARED, BLOCKED] }
        reasons: { type: array, items: { type: string } }
        reviews: { type: array, items: { $ref: '#/components/schemas/DependencyReview' } }
    ResourceGraphRequest:
      type: object
      additionalProperties: false
      required: [edges, reason]
      properties:
        edges: { type: array, maxItems: 1024, items: { $ref: '#/components/schemas/DependencyEdgeInput' } }
        reason: { type: string, minLength: 1, maxLength: 2000, description: Auditable explanation for the complete declared edge set }
    DependencyReviewRequest:
      type: object
      additionalProperties: false
      required: [graph_version, valid_until, acknowledgement, note]
      properties:
        graph_version: { type: integer, minimum: 1, description: Current declared graph revision; the initial unknown graph cannot be reviewed }
        valid_until: { type: string, format: date-time, description: UTC timestamp after now and no more than 24 hours ahead }
        acknowledgement: { type: string, enum: [REVIEWED_DISCOVERED_AND_EXTERNAL_DEPENDENCIES] }
        note: { type: string, minLength: 1, maxLength: 2000, description: Auditable review of discovered mappings, declared hard edges and external dependencies }
    DependencyReview:
      type: object
      required: [id, resource_id, graph_version, graph_hash, inventory_hash, reviewed_by, reviewed_at, expires_at, note, status, reasons]
      properties:
        id: { type: string }
        resource_id: { type: string }
        graph_version: { type: integer, minimum: 1 }
        graph_hash: { type: string }
        inventory_hash: { type: string }
        reviewed_by: { type: string }
        reviewed_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        note: { type: string }
        status: { type: string, enum: [READY, BLOCKED] }
        reasons: { type: array, items: { type: string } }
    DependencyReviews:
      type: object
      required: [resource_id, latest, reviews, status, reasons, current_graph_version]
      properties:
        resource_id: { type: string }
        latest:
          allOf: [ { $ref: '#/components/schemas/DependencyReview' } ]
          nullable: true
        reviews: { type: array, items: { $ref: '#/components/schemas/DependencyReview' } }
        status: { type: string, enum: [READY, BLOCKED, UNKNOWN] }
        reasons: { type: array, items: { type: string } }
        current_graph_version: { type: integer, minimum: 0 }
    Resource:
      allOf:
        - { $ref: '#/components/schemas/Document' }
        - type: object
          properties:
            name: { type: string }
            resource_type: { type: string, description: Existing EC2 or server-issued RDS_INSTANCE/RDS_CLUSTER/EBS_VOLUME/EBS_SNAPSHOT/S3_BUCKET and read-only AWS network discriminator. }
            storage_configuration: { $ref: '#/components/schemas/StorageAssessmentObject' }
            lambda_configuration: { $ref: '#/components/schemas/LambdaConfiguration' }
            service_family: { $ref: '#/components/schemas/AWSServiceFamily' }
            aws_service_configuration: { $ref: '#/components/schemas/AWSServiceConfiguration' }
            provider_relationships: { type: array, items: { $ref: '#/components/schemas/AWSServiceRelationship' } }
            network_configuration: { $ref: '#/components/schemas/NetworkConfiguration' }
            object_storage_configuration: { $ref: '#/components/schemas/ObjectStorageConfiguration' }
            engine: { type: string }
            engine_version: { type: string }
            provider_resource_id: { type: string }
            workload_id: { type: string }
            state: { type: string }
            eligibility: { type: string }
            blockers: { type: array, items: { type: string } }
            hourly_effective_cost: { $ref: '#/components/schemas/NullableDecimal' }
            monthly_effective_cost: { $ref: '#/components/schemas/NullableDecimal' }
            currency: { type: string, nullable: true }
    Recommendation:
      allOf:
        - { $ref: '#/components/schemas/Document' }
        - type: object
          properties:
            model_kind: { type: string, enum: [DATABASE_ASSESSMENT_V1, STORAGE_ASSESSMENT_V1, OBJECT_STORAGE_ASSESSMENT_V1, NETWORK_ASSESSMENT_V1, LAMBDA_ASSESSMENT_V1, AWS_SERVICE_ASSESSMENT_V1], description: Absent on legacy EC2 recommendations. Database, block-storage and S3 advice never enable EC2 change plans. }
            database_assessment_id: { type: string }
            storage_assessment_id: { type: string }
            object_storage_assessment_id: { type: string }
            lambda_assessment_id: { type: string }
            aws_service_assessment_id: { type: string }
            network_assessment_id: { type: string }
            assessment:
              oneOf:
                - { $ref: '#/components/schemas/DatabaseAssessment' }
                - { $ref: '#/components/schemas/StorageAssessment' }
                - { $ref: '#/components/schemas/ObjectStorageAssessment' }
                - { $ref: '#/components/schemas/LambdaAssessment' }
                - { $ref: '#/components/schemas/AWSServiceAssessment' }
                - { $ref: '#/components/schemas/NetworkAssessment' }
                - { $ref: '#/components/schemas/NetworkBlockedAssessment' }
            title: { type: string }
            resource_id: { type: string }
            workload_id: { type: string, nullable: true }
            status: { type: string }
            reason_code: { type: string }
            annual_saving: { $ref: '#/components/schemas/NullableDecimal' }
            monthly_saving: { $ref: '#/components/schemas/NullableDecimal' }
            currency: { type: string, nullable: true }
            pre_execution_ready: { type: boolean, description: Only explicit true permits a new plan. Legacy missing values are unactionable. }
            readiness_status: { type: string, enum: [READY, BLOCKED] }
            verification_status: { type: string, enum: [MEASURING, VERIFIED, BLOCKED, CONFOUNDED] }
            readiness_id: { type: string, nullable: true }
            baseline_id: { type: string, nullable: true }
            measurement_id: { type: string, nullable: true }
    Schedule: { allOf: [ { $ref: '#/components/schemas/Document' }, { $ref: '#/components/schemas/CreateScheduleRequest' } ] }
    ChangePlan:
      allOf:
        - { $ref: '#/components/schemas/Document' }
        - type: object
          properties:
            status: { type: string }
            risk_class: { type: string, enum: [R1] }
            resource_id: { type: string }
            recommendation_id: { type: string }
            schedule_id: { type: string }
            expires_at: { type: string, format: date-time }
            readiness_id: { type: string }
            baseline_id: { type: string }
            measurement_id: { type: string }
            activation_at: { type: string, format: date-time }
            payload: { $ref: '#/components/schemas/PlanPayload' }
            dependency_review_id: { type: string, nullable: true }
            dependency_graph_hash: { type: string, nullable: true }
    Execution:
      allOf:
        - { $ref: '#/components/schemas/Document' }
        - type: object
          properties:
            change_plan_id: { type: string }
            resource_id: { type: string }
            status: { type: string }
            stage: { type: string }
            restoration_owned: { type: boolean }
            error: { type: string }
    Savings:
      allOf:
        - { $ref: '#/components/schemas/Document' }
        - type: object
          properties:
            execution_id: { type: string }
            status: { type: string }
            currency: { type: string }
            verified_saving: { type: string, nullable: true }
            expected_baseline_cost: { $ref: '#/components/schemas/NullableDecimal' }
            actual_cost: { $ref: '#/components/schemas/NullableDecimal' }
            incremental_cost: { $ref: '#/components/schemas/NullableDecimal' }
            observed_saving: { $ref: '#/components/schemas/NullableDecimal' }
            baseline_id: { type: string }
            measurement_id: { type: string }
            measurement_snapshot_id: { type: string, nullable: true }
            activation_at: { type: string, format: date-time }
            financial_clock: { $ref: '#/components/schemas/Document' }
            is_current: { type: boolean }
            supersedes_id: { type: string }
    CloudAccount: { $ref: '#/components/schemas/Document' }
    Workload: { $ref: '#/components/schemas/Document' }
    AuditEvent: { $ref: '#/components/schemas/Document' }
    Policy: { $ref: '#/components/schemas/Document' }
    Dashboard:
      type: object
      required: [org, fixture, cloud_accounts, resources, workloads, recommendations, policies, schedules, change_plans, executions, savings, audit, data_quality, readiness]
      properties:
        org: { $ref: '#/components/schemas/Document' }
        fixture: { type: boolean }
        cloud_accounts: { type: array, items: { $ref: '#/components/schemas/CloudAccount' } }
        resources: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        workloads: { type: array, items: { $ref: '#/components/schemas/Workload' } }
        recommendations: { type: array, items: { $ref: '#/components/schemas/Recommendation' } }
        policies: { type: array, items: { $ref: '#/components/schemas/Policy' } }
        schedules: { type: array, items: { $ref: '#/components/schemas/Schedule' } }
        change_plans: { type: array, items: { $ref: '#/components/schemas/ChangePlan' } }
        executions: { type: array, items: { $ref: '#/components/schemas/Execution' } }
        savings: { type: array, items: { $ref: '#/components/schemas/Savings' } }
        audit: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        data_quality: { type: array, items: { $ref: '#/components/schemas/Document' } }
        readiness: { type: array, items: { $ref: '#/components/schemas/Readiness' } }
        source_connections: { type: array, items: { $ref: '#/components/schemas/SourceConnection' } }
        activity_sources: { type: array, items: { $ref: '#/components/schemas/Document' } }
        dependency_graph: { $ref: '#/components/schemas/ResourceGraph' }
        slo_objectives: { type: array, items: { $ref: '#/components/schemas/SloObjective' } }
        slo_sources: { type: array, items: { $ref: '#/components/schemas/SloSource' } }
        slo_evaluations: { type: array, items: { $ref: '#/components/schemas/SloEvaluationSnapshot' } }
    EvidenceBinding:
      type: object
      required: [tenant_id, resource_id, provider_resource_id, account_id, region, currency]
      properties:
        tenant_id: { type: string }
        resource_id: { type: string }
        provider_resource_id: { type: string }
        account_id: { type: string }
        region: { type: string }
        currency: { type: string, nullable: true }
    Readiness:
      allOf:
        - { $ref: '#/components/schemas/Document' }
        - type: object
          required: [status, pre_execution_ready, verification_status, resource_id, checked_at, expires_at, binding]
          properties:
            status: { type: string, enum: [READY, BLOCKED] }
            pre_execution_ready: { type: boolean }
            verification_status: { type: string, enum: [MEASURING, VERIFIED, BLOCKED, CONFOUNDED] }
            reason_code: { type: string }
            resource_id: { type: string }
            workload_id: { type: string }
            baseline_id: { type: string, nullable: true }
            measurement_id: { type: string, nullable: true }
            activation_at: { type: string, nullable: true, format: date-time }
            checked_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
            binding: { $ref: '#/components/schemas/EvidenceBinding' }
            blockers: { type: array, items: { type: string } }
            evidence_refs: { type: array, items: { type: string } }
            source_refs: { type: array, items: { $ref: '#/components/schemas/SourceReference' } }
            proof_set_id: { type: string, nullable: true }
            source_proof: { $ref: '#/components/schemas/SourceProof' }
            commitment_scope: { $ref: '#/components/schemas/CommitmentScope' }
            activity_signal: { $ref: '#/components/schemas/ActivitySignal' }
            dependency_status: { type: string, enum: [READY, BLOCKED, UNKNOWN] }
            dependency_reasons: { type: array, items: { type: string } }
            dependency_review_id: { type: string, nullable: true }
            dependency_graph_hash: { type: string, nullable: true }
            slo_status: { type: string, enum: [CLEAR, BLOCKED] }
            slo_reasons: { type: array, items: { type: string } }
            slo_objective_id: { type: string, nullable: true }
            slo_objective_version: { type: integer, nullable: true, minimum: 1 }
            slo_objective_hash: { type: string, nullable: true }
            slo_evaluation_id: { type: string, nullable: true }
            slo_evaluation_hash: { type: string, nullable: true }
            slo_evaluation: { $ref: '#/components/schemas/SloEvaluation' }
            pricing_basis: { type: array, items: { type: string, enum: [NET_UNBLENDED, UNBLENDED] } }
    SourceReference:
      type: object
      required: [kind, ingestion_job_id, source_id, source_version, source_hash, canonical_hash, binding]
      properties:
        kind: { type: string, enum: [AWS_CUR2] }
        ingestion_job_id: { type: string }
        source_id: { type: string }
        source_version: { type: string }
        source_hash: { type: string, description: SHA-256 of immutable imported raw source JSON }
        canonical_hash: { type: string, description: SHA-256 of persisted canonical snapshot JSON }
        source_receipt_id: { type: string, description: Ingester-issued immutable version 3 receipt }
        source_revision_id: { type: string }
        binding: { $ref: '#/components/schemas/EvidenceBinding' }
    PlanPayload:
      allOf:
        - { $ref: '#/components/schemas/Document' }
        - type: object
          required: [schema_version, baseline_id, measurement_id, readiness_id, activation_at]
          properties:
            schema_version: { type: string, enum: ['2', '3'] }
            proof_set_id: { type: string, description: Required for all new live stops; signed immutable proof set }
            dependency_review_id: { type: string, description: Required for new schema-3 stops; immutable explicit dependency review }
            dependency_graph_hash: { type: string, description: Required for new schema-3 stops; binds the reviewed graph revision }
            slo_objective_id: { type: string, description: Required for new schema-3 stops; immutable workload objective }
            slo_objective_version: { type: integer, minimum: 1 }
            slo_objective_hash: { type: string }
            slo_evaluation_id: { type: string, description: Required for new schema-3 stops; immutable trusted evaluation }
            slo_evaluation_hash: { type: string }
            baseline_id: { type: string }
            measurement_id: { type: string }
            readiness_id: { type: string }
            activation_at: { type: string, format: date-time }
    WorkloadSample:
      type: object
      required: [resource_id, provider_resource_id, account_id, region, start, end, units, source_record_id]
      properties:
        tenant_id: { type: string }
        resource_id: { type: string }
        provider_resource_id: { type: string }
        account_id: { type: string }
        region: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        units: { $ref: '#/components/schemas/Decimal' }
        source_record_id: { type: string }
    BillingImportRequest:
      type: object
      required: [schema_version, source_id, source_version, records]
      properties:
        schema_version: { type: string, enum: ['2'] }
        source_id: { type: string }
        source_version: { type: string }
        records: { type: array, items: { $ref: '#/components/schemas/Document' } }
        invoice_totals:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Decimal' }
        invoice: { $ref: '#/components/schemas/SourceInvoice' }
    SourceInvoice:
      type: object
      required: [invoice_id, issued_at, final, total]
      properties:
        invoice_id: { type: string }
        issued_at: { type: string, format: date-time }
        final: { type: boolean }
        total: { $ref: '#/components/schemas/Decimal' }
    BaselineRequest:
      type: object
      additionalProperties: false
      required: [schema_version, resource_id, source_connection_id, schedule_id, start, end]
      properties:
        schema_version: { type: string, enum: ['3'] }
        resource_id: { type: string }
        source_connection_id: { type: string }
        schedule_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    MeasurementRequest:
      type: object
      additionalProperties: false
      required: [schema_version, measurement_id, source_connection_id, start, end]
      properties:
        schema_version: { type: string, enum: ['3'] }
        measurement_id: { type: string }
        source_connection_id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    ConnectAccountRequest:
      type: object
      required: [provider, name, account_id, region]
      properties:
        provider: { type: string, enum: [AWS] }
        name: { type: string }
        account_id: { type: string }
        region: { type: string }
    CreateScheduleRequest:
      type: object
      required: [workload_id, stop_time, ready_time, timezone, days]
      properties:
        workload_id: { type: string }
        stop_time: { type: string, example: '20:00' }
        ready_time: { type: string, example: '07:00' }
        timezone: { type: string, example: Europe/London }
        days: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        mode: { type: string, enum: [OBSERVE, RECOMMEND, ASSISTED_EXECUTION, AUTOPILOT, FROZEN] }
        autopilot_opt_in: { type: boolean }
        memory_state_acknowledged: { type: boolean }
        public_ip_change_acknowledged: { type: boolean }
    CreatePlanRequest:
      type: object
      required: [recommendation_id, memory_state_acknowledged, public_ip_change_acknowledged]
      properties:
        recommendation_id: { type: string }
        schedule_id: { type: string }
        memory_state_acknowledged: { type: boolean, enum: [true] }
        public_ip_change_acknowledged: { type: boolean, enum: [true] }
