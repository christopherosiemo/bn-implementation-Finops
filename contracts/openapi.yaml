    TelemetryReceiptPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TelemetryReceipt' } }
        next_cursor: { type: string, nullable: true }
    SafetyWeeklyWindow:
      type: object
      additionalProperties: false
      required: [days, start_time, end_time]
      properties:
        days: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 } }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end_time: { type: string, pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$', description: Unequal to start; an earlier end means the next local day and 24:00 means the end of the local day }
    SafetyBlackout:
      type: object
