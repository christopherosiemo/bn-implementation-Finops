openapi: 3.0.3
info:
  title: Cloud Cost Autopilot AWS Pilot
  version: 0.3.0
  description: Tenant identity comes exclusively from the validated OIDC token. Monetary values are decimal strings. All POSTs require Idempotency-Key; resource updates also require If-Match.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /deployment-callbacks/{command_id}:
    post:
      operationId: receiveDeploymentAttestation
      description: Separate deployment-observer service. Dedicated machine OIDC and an exact registered issuer/subject/audience/pipeline binding are required. The exact body is retained. APPLIED establishes owned state change; it never releases a disruption reservation or proves health, source membership, savings or permission to expand. Console tokens cannot submit attestations. The optional service is disabled by default.
      security: [ { deploymentMachineAuth: [] } ]
      parameters:
        - { name: command_id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: X-Finops-Source-ID, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FleetDeploymentCallback' }
      responses:
        '201':
          description: Immutable authenticated callback persisted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetDeploymentCallbackResult' }
        '200':
          description: Exact original callback replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetDeploymentCallbackResult' }
        '401': { description: Dedicated machine authentication required; human roles are rejected }
        '403': { description: Registered source or command binding does not match }
        '409': { description: Conflicting raw-body replay }
        '413': { description: Body exceeds 64 KiB }
        '415': { description: Uncompressed application/json required }
        '422': { description: Invalid exact artifact, state, ownership or outcome binding }
        '503': { description: Observer or persistence unavailable; outcome must remain unknown }
  /resources/{id}/configuration-authorities:
    get:
      operationId: listConfigurationAuthorityRevisions
      description: Current operator declaration and immutable cursor-paginated history within the resource's authorized workload. A declaration is not machine evidence or execution permission.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/PageLimit' }, { $ref: '#/components/parameters/PageCursor' } ]
      responses:
        '200':
          description: Latest version zero and null latest before the first declaration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationAuthorityPage' }
        '403': { description: Resource workload is outside the caller's scope }
        '404': { description: Resource not found within tenant }
        '422': { description: Invalid or differently scoped cursor }
    post:
      operationId: declareConfigurationAuthority
      description: PLATFORM_ADMIN appends a Terraform declaration. If-Match binds the latest declaration version, initially zero. Tenant, inventory binding, resource version and hash are selected by the server. Repository and issuer URLs are metadata only and are never fetched. Credentials, observed commits, state serials, proofs and execution permissions are not accepted. Execution remains disabled until separate machine evidence and action-specific gates exist.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigurationAuthorityRequest' }
      responses:
        '201':
          description: Immutable DECLARED_NOT_ATTESTED revision with no execution authority
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationAuthority' }
        '403': { description: PLATFORM_ADMIN and resource workload scope required }
        '409': { description: Declaration version changed or idempotency key conflicts }
        '422': { description: Invalid metadata, dedicated pipeline identity, state lineage, managed address or provider binding }
        '428': { description: Latest declaration version required in If-Match }
  /workloads/{id}/configuration-proposals:
    get:
      operationId: listConfigurationProposals
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/PageLimit' }, { $ref: '#/components/parameters/PageCursor' } ]
      responses:
        '200':
          description: Workload-scoped immutable blocked proposals, preserving their original evidence references
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationProposalPage' }
        '403': { description: Workload outside caller scope }
        '422': { description: Invalid or differently scoped cursor }
    post:
      operationId: recordBlockedConfigurationProposal
      description: PLATFORM_ADMIN selects only existing declaration and capacity-assessment IDs. If-Match binds the selected authority version. The server rechecks the latest declaration, exact inventory snapshot, workload safety profile and active native source. No patch, plan, price, arbitrary evidence or trusted pipeline assertion can be submitted. The result remains BLOCKED with null monetary estimates and no change plan.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [authority_id, capacity_assessment_id], properties: { authority_id: { type: string, minLength: 1 }, capacity_assessment_id: { type: string, minLength: 1 } } }
      responses:
        '201':
          description: Immutable blocked proposal; no execution plan or claimed savings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationProposal' }
        '403': { description: PLATFORM_ADMIN and workload scope required }
        '404': { description: Referenced evidence not found within tenant }
        '409': { description: Declaration superseded, stale If-Match or idempotency conflict }
        '422': { description: Resource, safety profile, assessment or native source no longer matches }
        '428': { description: Current authority version required in If-Match }
  /workloads/{id}/configuration-proposals/{proposalId}:
    get:
      operationId: getConfigurationProposal
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: proposalId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: Immutable proposal within the selected authorized workload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationProposal' }
        '403': { description: Workload outside caller scope }
        '404': { description: Proposal not found in tenant or selected workload }
  /workloads/{id}/capacity-assessments:
    get:
      operationId: listCapacityAssessments
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/PageLimit' }, { $ref: '#/components/parameters/PageCursor' } ]
      responses:
        '200':
          description: Tenant and workload scoped immutable analytical history; no raw sample batches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityAssessmentPage' }
    post:
      operationId: assessNativeCapacityEvidence
      description: Selects persisted native observations and the current workload safety profile. If-Match binds the safety profile version. Clients cannot submit telemetry, catalogues, prices, history or validation assertions. This increment reports BLOCKED while native provider hardware and contracted prices are unavailable; it never creates or authorizes a change plan.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [connection_id], properties: { connection_id: { type: string, minLength: 1 } } }
      responses:
        '201':
          description: Immutable assessment binds the selected source, profile, observation population and receipts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapacityAssessment' }
        '403': { description: Analyst or scoped application owner role required }
        '409': { description: Safety profile version changed }
        '422': { description: Missing safety profile, inactive or mismatched source, or caller-supplied evidence }
        '503': { description: Independent native evidence selection unavailable or invalid }
  /telemetry-connections:
    get:
      operationId: listTelemetryConnections
      parameters: [ { $ref: '#/components/parameters/PageLimit' }, { $ref: '#/components/parameters/PageCursor' }, { name: workload_id, in: query, schema: { type: string }, description: Required explicit owned workload scope for APPLICATION_OWNER } ]
      responses:
        '200':
          description: Cursor-paginated native telemetry source metadata within authorized workload scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryConnectionPage' }
    post:
      operationId: registerTelemetryConnection
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      description: PLATFORM_ADMIN registers definitions and an approved read binding or exact OTLP machine subject. Provider binding, identity, issuer and mandatory resource selectors are server selected. Registration does not create observations or execution authority.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetryConnectionRequest' }
      responses:
        '201':
          description: Immutable initial connection revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryConnection' }
        '403': { description: PLATFORM_ADMIN and workload scope required }
        '422': { description: Invalid definitions, resource binding or approved source identity }
  /telemetry-connections/{id}:
    get:
      operationId: getTelemetryConnection
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Current immutable configuration and source revision metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryConnection' }
  /telemetry-connections/{id}/revisions:
    post:
      operationId: reviseTelemetryConnection
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetryConnectionRequest' }
      responses:
        '201':
          description: New immutable definition revision; previous evidence cannot authorize the new configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryConnection' }
        '403': { description: PLATFORM_ADMIN and workload scope required }
        '409': { description: Connection version changed }
        '422': { description: Invalid definitions or source binding }
  /telemetry-connections/{id}/sync:
    post:
      operationId: syncTelemetryConnection
      description: Queues durable Prometheus source collection. History length is selected server-side from workload requirements (14, 30 or 90 days); no caller-supplied observations or historical authority.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '202':
          description: Durable synchronization requested; publication completion does not establish observed coverage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetrySyncJob' }
        '409': { description: Connection version changed }
        '422': { description: Revoked or unsupported source }
  /telemetry-connections/{id}/sync/{sync_id}:
    get:
      operationId: getTelemetrySyncJob
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: sync_id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: Durable source publication status without worker leases or credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetrySyncJob' }
        '404': { description: Job absent from this tenant and connection }
  /telemetry-connections/{id}/revoke:
    post:
      operationId: revokeTelemetryConnection
      description: Revokes current source authority while preserving immutable receipts and owned recovery duties.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1 } } }
      responses: { '200': { description: Immutable source revocation appended }, '409': { description: Connection version changed }, '403': { description: PLATFORM_ADMIN required } }
  /telemetry-connections/{id}/evaluate:
    post:
      operationId: evaluateTelemetryConnection
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [mode], properties: { mode: { type: string, enum: [history, window] } } }
      responses:
        '201':
          description: Immutable evaluation from server-selected current definitions and persisted receipts; no execution authorization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryEvaluationRecord' }
        '409': { description: Connection version changed }
        '422': { description: Missing, revoked or invalid source evidence }
  /telemetry-connections/{id}/receipts:
    get:
      operationId: listTelemetryReceipts
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/PageLimit' }, { $ref: '#/components/parameters/PageCursor' } ]
      responses:
        '200':
          description: Immutable source receipt metadata with actual native timestamps and content hashes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryReceiptPage' }
  /telemetry-connections/{id}/evaluations:
    get:
      operationId: listTelemetryEvaluations
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/PageLimit' }, { $ref: '#/components/parameters/PageCursor' } ]
      responses:
        '200':
          description: Cursor-paginated immutable evaluation history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryEvaluationPage' }
  /metric-definitions:
    get:
      operationId: listMetricDefinitions
      parameters: [ { name: connection_id, in: query, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: At most 32 current registered definitions, with immutable connection binding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelemetryDefinitionPage' }
  /workloads/{id}/safety-profiles:
    get:
      operationId: listWorkloadSafetyProfiles
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/PageLimit' }, { $ref: '#/components/parameters/PageCursor' } ]
      responses:
        '200':
          description: Latest workload requirements and cursor-paginated immutable revision history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkloadSafetyPage' }
    post:
      operationId: reviseWorkloadSafetyProfile
      description: PLATFORM_ADMIN declares action-specific requirements, with If-Match latest profile version including zero. RPO must be explicit null when unknown. Requirements do not establish observed capacity, replica health, recovery or execution authority.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkloadSafetyRequest' }
      responses:
        '201':
          description: Immutable requirements revision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkloadSafetyProfile' }
        '403': { description: PLATFORM_ADMIN and workload scope required }
        '409': { description: Safety profile version changed }
        '422': { description: Incomplete or invalid action requirements }
  /workloads/{id}/safety-evaluation:
    get:
      operationId: evaluateWorkloadSafetyRequirements
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Present requirement-window assessment. This view grants no execution authority and does not fabricate RTO/RPO or topology proof.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkloadSafetyEvaluation' }
  /workloads/{id}/slo-objectives:
    get:
      operationId: listSloObjectives
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Latest immutable workload objective and revision history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SloObjectiveHistory' }
    post:
      operationId: reviseSloObjective
      description: PLATFORM_ADMIN records an immutable objective revision. If-Match is the latest objective version, including zero before the first revision. Hard objectives and baseline regression guards are independent; neither can waive the other. No evidence is accepted from the browser.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SloObjectiveRequest' }
      responses:
        '201':
          description: Immutable objective revision recorded; prior stop authority requires reassessment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SloObjective' }
        '403': { description: PLATFORM_ADMIN required }
        '409': { description: Objective version changed; refresh before retrying }
        '422': { description: Invalid limits, evaluation window, timezone, same-day availability windows or regression guard }
  /slo-sources:
    get:
      operationId: listSloSources
      responses:
        '200':
          description: Registered independent machine collectors; registration alone does not establish evidence coverage
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SloSource' } }
    post:
      operationId: registerSloSource
      description: PLATFORM_ADMIN binds an existing objective and resource to an exact machine subject. Console tokens cannot ingest SLO intervals.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SloSourceRequest' }
      responses:
        '201':
          description: Machine collector registration recorded without execution authority
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SloSource' }
        '403': { description: PLATFORM_ADMIN required }
        '409': { description: Conflicting source binding }
        '422': { description: Invalid objective, resource binding or machine subject }
  /resources/{id}/slo-evaluation:
    get:
      operationId: getSloEvaluation
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Current trusted SLO evaluation and immutable snapshot binding when available. Missing evidence remains blocked or unavailable, never zero latency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SloEvaluationSnapshot' }
  /slo/intervals:
    post:
      operationId: ingestSloInterval
      description: Isolated activity-ingress service accepts exact registered machine subjects with the dedicated machine audience. Console tokens cannot ingest evidence. One UTC minute per observation; non-cumulative histogram bucket counts must sum to request_count. Exact replays are idempotent; historical backfills and conflicting receipts are rejected.
      security: [ { activityMachineAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SloInterval' }
      responses:
        '201': { description: Authenticated immutable minute observation appended }
        '200': { description: Exact receipt replay }
        '403': { description: Dedicated registered machine identity required; console tokens denied }
        '409': { description: Conflicting sequence, interval or idempotency key }
        '422': { description: Stale, incomplete, incorrectly bound observation or inconsistent histogram }
  /resource-graph:
    get:
      operationId: getResourceGraph
      responses:
        '200':
          description: Current inventory-derived mappings, operator declarations and immutable reviews. DECLARED is not automatic dependency discovery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceGraph' }
    post:
      operationId: reviseResourceGraph
      description: PLATFORM_ADMIN records a complete declared edge set as an immutable graph revision. All edges are hard dependencies; discovered mappings remain server-derived. If-Match is the graph version, including zero for the initial unknown graph.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceGraphRequest' }
      responses:
        '201':
          description: Immutable operator-declared revision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceGraph' }
        '403': { description: PLATFORM_ADMIN required }
        '409': { description: Graph version or inventory changed; refresh before retrying }
        '422': { description: Invalid graph fields, missing reason, unsupported edge type, unresolved endpoint, self edge, cycle or edge limit }
  /resources/{id}/dependency-reviews:
    get:
      operationId: listDependencyReviews
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Current dependency assessment and immutable review history for the resource
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependencyReviews' }
    post:
      operationId: reviewResourceDependencies
      description: PLATFORM_ADMIN explicitly reviews discovered and external dependencies. If-Match is the resource version. Validity is at most 24 hours. A recorded review can remain BLOCKED; it never approves or executes a change plan.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependencyReviewRequest' }
      responses:
        '201':
          description: Immutable review bound to graph and inventory hashes, including blocking reasons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DependencyReview' }
        '403': { description: PLATFORM_ADMIN required }
        '409': { description: Resource version, graph or inventory changed; refresh before retrying }
        '422': { description: Invalid review fields, acknowledgement, note, expiry or unresolved dependency graph }
  /source-connections:
    get:
      operationId: listSourceConnections
      responses:
        '200':
          description: Tenant source health and trusted ingestion status
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SourceConnection' } }
    post:
      operationId: registerSourceConnection
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceConnectionRequest' }
      responses: { '201': { description: AWS location registered; trust requires successful independent ingestion } }
  /source-connections/{id}:
    get:
      operationId: inspectSourceConnection
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Registration, immutable receipts and source-specific blockers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceConnection' }
  /source-connections/{id}/sync:
    post:
      operationId: syncSourceConnection
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '202': { description: Durable ingestion request queued; no execution permission granted } }
  /source-connections/{id}/revoke:
    post:
      operationId: revokeSourceConnection
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '202': { description: New stops blocked; existing owned restoration remains authorized } }
  /activity-sources:
    get:
      operationId: listActivitySources
      responses: { '200': { description: Registered independent workload collectors } }
    post:
      operationId: registerActivitySource
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivitySourceRequest' }
      responses: { '201': { description: Exact machine subject and metric definition registered for the resource } }
  /activity/intervals:
    post:
      operationId: ingestActivityInterval
      description: Served by the isolated activity-ingress service. Dedicated machine OIDC audience required; console tokens cannot authorize ingestion. Sequence and content hash provide idempotency.
      security: [ { activityMachineAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInterval' }
      responses: { '201': { description: Authenticated immutable minute observation }, '200': { description: Exact replay }, '409': { description: Conflicting sequence or interval }, '422': { description: Stale, incomplete or incorrectly bound observation } }
  /dashboard:
    get:
      operationId: dashboard
      responses:
        '200':
          description: Current tenant dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
  /cloud-accounts:
    post:
      operationId: connectAccount
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectAccountRequest' }
      responses:
        '201':
          description: Account connected and read-only inventory discovered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloudAccount' }
  /recommendations:
    post:
      operationId: generateRecommendations
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '201': { description: Recommendations generated } }
  /workloads:
    post:
      operationId: createWorkload
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '201': { description: Non-production workload with owner and mandatory health URL created; signals initially UNKNOWN } }
  /policies/{id}:
    post:
      operationId: updatePolicy
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '200': { description: Scoped workload_autopilot_ids and pause updated; temporary Autopilot grant expires in 30 days } }
  /resources/{id}/configure:
    post:
      operationId: configureResource
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '200': { description: Explicit workload mapping and field-specific runtime delegation configured } }
  /billing/import:
    post:
      operationId: importBilling
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingImportRequest' }
      responses: { '202': { description: AWS CUR 2.0 source records normalized and queued for immutable persistence. Caller supplied economic evidence flags are rejected. } }
  /resources/{id}/readiness:
    get:
      operationId: resourceReadiness
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Fresh operational assessment bound to the latest sealed readiness report. Reports expire after five minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /resources/{id}/readiness/refresh:
    post:
      operationId: refreshReadiness
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses:
        '201':
          description: Immutable baseline and operational readiness assessment sealed. Generate recommendations to use this report in a plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /evidence/baselines:
    post:
      operationId: sealBaseline
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BaselineRequest' }
      responses: { '201': { description: Immutable source-bound baseline sealed; requires at least fourteen complete local days and validated idle-workload evidence } }
  /evidence/measurements:
    post:
      operationId: sealMeasurement
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasurementRequest' }
      responses: { '201': { description: Immutable measurement snapshot sealed against the signed reservation; costs and invoice reconciliation derive from its persisted canonical source } }
  /schedules:
    post:
      operationId: createSchedule
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScheduleRequest' }
      responses: { '201': { description: Approved schedule definition created } }
  /change-plans:
    post:
      operationId: createPlan
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlanRequest' }
      responses: { '201': { description: Immutable resource occurrence plan awaiting approval } }
  /approvals:
    post:
      operationId: approvePlan
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/PlanReference' }
      responses: { '201': { description: Exact plan approved; returns approval and updated change_plan } }
  /executions:
    post:
      operationId: executePlan
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/PlanReference' }
      responses: { '202': { description: Durable stop and restoration occurrence queued } }
  /executions/{id}/start-now:
    post:
      operationId: restoreNow
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '202': { description: Owned restoration requested; pause never cancels restoration } }
  /schedules/{id}/pause:
    post:
      operationId: pauseSchedule
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '200': { description: Schedule paused or resumed } }
  /schedules/{id}/skip-next-stop:
    post:
      operationId: skipStop
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '200': { description: Next stop will be skipped } }
  /workloads/{id}/signals:
    post:
      operationId: updateSignals
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '200': { description: Fresh explicit incident/deployment/job signals recorded } }
  /control/pause:
    post:
      operationId: pauseAutopilot
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '200': { description: New stops blocked; recovery remains authorized } }
  /savings/verify:
    post:
      operationId: verifySavings
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '200': { description: Append verified or provisional evidence; negative values preserved } }
  /demo/reset:
    post:
      operationId: resetFixture
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '200': { description: Fixture-only reset; audit and ledger retained } }
  /demo/scenario:
    post:
      operationId: fixtureScenario
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '200': { description: Fixture healthy/incident/job/deployment/stale/unhealthy scenario selected } }
components:
  securitySchemes:
    deploymentMachineAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: Dedicated finops-deployment-observer audience and exact registered machine issuer/subject; no human roles }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    activityMachineAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: Dedicated finops-activity audience and registered machine subject }
  parameters:
    PageLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    PageCursor: { name: cursor, in: query, schema: { type: string }, description: Opaque tenant/query-bound cursor; never derive it from resource contents }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: Quoted current integer version ETag; stale updates return 409. }
  requestBodies:
    Document:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Document' }
    PlanReference:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [change_plan_id]
            properties:
              change_plan_id: { type: string }
  schemas:
    FleetDeploymentCallback:
      type: object
      additionalProperties: false
      required: [schema_version, command_id, child_id, child_sha256, saved_plan_sha256, child_nonce, state_lineage, before_state_serial, after_state_serial, outcome, observed_at, old_instance_ids, candidate_instance_ids]
      properties:
        schema_version: { type: string, enum: ['4'] }
        command_id: { type: string, minLength: 1 }
        child_id: { type: string, minLength: 1 }
        child_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        saved_plan_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        child_nonce: { type: string, minLength: 1 }
        state_lineage: { type: string, minLength: 1 }
        before_state_serial: { type: integer, minimum: 0, description: Exact Terraform state serial; machine clients must retain integer precision. }
        after_state_serial: { type: integer, minimum: 0, description: Applied changes must advance the exact state serial. }
        outcome: { type: string, enum: [APPLIED, DEFINITELY_NOT_APPLIED, UNKNOWN, NO_OP] }
        observed_at: { type: string, format: date-time }
        old_instance_ids: { type: array, uniqueItems: true, items: { type: string, pattern: '^i-([a-f0-9]{8}|[a-f0-9]{17})$' } }
        candidate_instance_ids: { type: array, uniqueItems: true, items: { type: string, pattern: '^i-([a-f0-9]{8}|[a-f0-9]{17})$' } }
        reason_code: { type: string }
    FleetDeploymentCallbackResult:
      type: object
      required: [receipt, replayed]
      properties:
        receipt:
          type: object
          additionalProperties: true
          description: Original callback plus server-generated immutable identity and authenticated provenance. No saved Terraform plan, state payload or credentials are returned.
          required: [id, tenant_id, source_id, body_sha256, received_at, writer_role, schema_version, command_id, child_id, outcome]
          properties:
            id: { type: string }
            tenant_id: { type: string }
            source_id: { type: string }
            body_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            received_at: { type: string, format: date-time }
            writer_role: { type: string, enum: [finops_deployment_observer] }
            schema_version: { type: string, enum: ['4'] }
            command_id: { type: string }
            child_id: { type: string }
            outcome: { type: string, enum: [APPLIED, DEFINITELY_NOT_APPLIED, UNKNOWN, NO_OP] }
        replayed: { type: boolean }
    ConfigurationRepository:
      type: object
      additionalProperties: false
      required: [url, ref, directory]
      properties:
        url: { type: string, format: uri, maxLength: 2048, description: HTTPS repository metadata without credentials, query or fragment; no network fetch }
        ref: { type: string, minLength: 1, maxLength: 255, description: Declared Git branch or tag; not an observed commit or receipt }
        directory: { type: string, minLength: 1, maxLength: 512, description: Canonical repository-relative directory, or dot for root; no traversal }
    ConfigurationPipelineIdentity:
      type: object
      additionalProperties: false
      required: [issuer, audience, subject, pipeline_id]
      properties:
        issuer: { type: string, format: uri, maxLength: 2048, description: HTTPS issuer metadata without credentials, query or fragment }
        audience: { type: string, enum: [finops-deployment-observer] }
        subject: { type: string, minLength: 1, maxLength: 512, description: Exact machine subject; no wildcard or whitespace }
        pipeline_id: { type: string, minLength: 1, maxLength: 256, description: Stable exact pipeline identity; no secret }
    ConfigurationPipeline:
      type: object
      additionalProperties: false
      required: [system, identity]
      properties:
        system: { type: string, enum: [GITHUB_ACTIONS, GITLAB_CI, BITBUCKET_PIPELINES, OTHER] }
        identity: { $ref: '#/components/schemas/ConfigurationPipelineIdentity' }
    ConfigurationTerraform:
      type: object
      additionalProperties: false
      required: [workspace, state_lineage, addresses]
      properties:
        workspace: { type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' }
        state_lineage: { type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', description: Declared canonical Terraform state lineage, not independently observed state }
        addresses: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 512 }, description: Exact managed-resource addresses; indexed module paths supported, data sources and wildcards rejected }
    ConfigurationAuthorityRequest:
      type: object
      additionalProperties: false
      required: [schema_version, authority, repository, pipeline, terraform]
      properties:
        schema_version: { type: string, enum: ['1'] }
        authority: { type: string, enum: [TERRAFORM] }
        repository: { $ref: '#/components/schemas/ConfigurationRepository' }
        pipeline: { $ref: '#/components/schemas/ConfigurationPipeline' }
        terraform: { $ref: '#/components/schemas/ConfigurationTerraform' }
    ConfigurationBinding:
      allOf:
        - { $ref: '#/components/schemas/NativeResourceBinding' }
        - type: object
          required: [resource_version, resource_snapshot_hash]
          properties:
            resource_version: { type: integer, minimum: 1 }
            resource_snapshot_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
    ConfigurationAuthority:
      type: object
      required: [schema_version, id, version, authority, repository, pipeline, terraform, binding, status, reason_codes, execution_authorized, observed_commit, observed_state_serial, declared_by, hash, created_at, writer_role]
      properties:
        schema_version: { type: string, enum: ['1'] }
        id: { type: string }
        version: { type: integer, minimum: 1 }
        authority: { type: string, enum: [TERRAFORM] }
        repository: { $ref: '#/components/schemas/ConfigurationRepository' }
        pipeline: { $ref: '#/components/schemas/ConfigurationPipeline' }
        terraform: { $ref: '#/components/schemas/ConfigurationTerraform' }
        binding: { $ref: '#/components/schemas/ConfigurationBinding' }
        status: { type: string, enum: [DECLARED_NOT_ATTESTED] }
        reason_codes: { type: array, minItems: 2, items: { type: string } }
        execution_authorized: { type: boolean, enum: [false] }
        observed_commit: { type: string, nullable: true, enum: [null], description: No operator assertion can populate a machine-observed commit }
        observed_state_serial: { type: integer, nullable: true, enum: [null], description: No operator assertion can populate an observed Terraform state serial }
        declared_by: { type: string }
        hash: { type: string }
        created_at: { type: string, format: date-time }
        writer_role: { type: string }
    ConfigurationAuthorityPage:
      type: object
      required: [version, latest, items, next_cursor]
      properties:
        version: { type: integer, minimum: 0 }
        latest: { nullable: true, allOf: [ { $ref: '#/components/schemas/ConfigurationAuthority' } ] }
        items: { type: array, items: { $ref: '#/components/schemas/ConfigurationAuthority' } }
        next_cursor: { type: string, nullable: true }
    ConfigurationProposal:
      type: object
      required: [schema_version, id, binding, workload_id, resource_id, authority_id, authority_version, authority_hash, capacity_assessment_id, capacity_assessment_hash, population_hash, connection_id, connection_version, revision_id, config_hash, safety_profile_id, safety_profile_version, safety_profile_hash, status, reason_codes, execution_authorized, estimated_saving, verified_saving, change_plan_id, proposed_by, hash, created_at, writer_role]
      properties:
        schema_version: { type: string, enum: ['1'] }
        id: { type: string }
        binding: { $ref: '#/components/schemas/ConfigurationBinding' }
        workload_id: { type: string }
        resource_id: { type: string }
        authority_id: { type: string }
        authority_version: { type: integer, minimum: 1 }
        authority_hash: { type: string }
        capacity_assessment_id: { type: string }
        capacity_assessment_hash: { type: string }
        population_hash: { type: string }
        connection_id: { type: string }
        connection_version: { type: integer, minimum: 1 }
        revision_id: { type: string }
        config_hash: { type: string }
        safety_profile_id: { type: string }
        safety_profile_version: { type: integer, minimum: 1 }
        safety_profile_hash: { type: string }
        status: { type: string, enum: [BLOCKED] }
        reason_codes: { type: array, minItems: 1, items: { type: string } }
        execution_authorized: { type: boolean, enum: [false] }
        estimated_saving: { type: string, nullable: true, enum: [null] }
        verified_saving: { type: string, nullable: true, enum: [null] }
        change_plan_id: { type: string, nullable: true, enum: [null] }
        proposed_by: { type: string }
        hash: { type: string }
        created_at: { type: string, format: date-time }
        writer_role: { type: string }
    ConfigurationProposalPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ConfigurationProposal' } }
        next_cursor: { type: string, nullable: true }
    CapacityAssessment:
      type: object
      required: [schema_version, id, workload_id, resource_id, connection_id, connection_version, revision_id, config_hash, safety_profile_id, safety_profile_version, safety_profile_hash, population_hash, receipt_ids, source_refs, history, native_evaluation, status, reason_codes, execution_authorized, hardware_catalog_status, native_price_status, estimated_saving, verified_saving, hash, created_at, writer_role]
      properties:
        schema_version: { type: string, enum: ['1'] }
        id: { type: string }
        workload_id: { type: string }
        resource_id: { type: string }
        connection_id: { type: string }
        connection_version: { type: integer, minimum: 1 }
        revision_id: { type: string }
        config_hash: { type: string }
        safety_profile_id: { type: string }
        safety_profile_version: { type: integer, minimum: 1 }
        safety_profile_hash: { type: string }
        population_hash: { type: string }
        receipt_ids: { type: array, maxItems: 2048, items: { type: string } }
        source_refs:
          type: array
          maxItems: 2048
          items:
            type: object
            required: [receipt_id, batch_id, config_hash, raw_sha256, canonical_hash]
            properties:
              receipt_id: { type: string }
              batch_id: { type: string }
              config_hash: { type: string }
              raw_sha256: { type: string }
              canonical_hash: { type: string }
        history:
          type: object
          required: [start, end, days, timezone, environment]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            days: { type: integer, enum: [14, 30, 90] }
            timezone: { type: string }
            environment: { type: string, enum: [NON_PRODUCTION, PRODUCTION, UNKNOWN] }
        native_evaluation: { $ref: '#/components/schemas/NativeTelemetryEvaluation' }
        status: { type: string, enum: [BLOCKED] }
        reason_codes: { type: array, minItems: 1, items: { type: string } }
        execution_authorized: { type: boolean, enum: [false] }
        hardware_catalog_status: { type: string, enum: [UNAVAILABLE] }
        native_price_status: { type: string, enum: [UNAVAILABLE] }
        estimated_saving: { $ref: '#/components/schemas/NullableDecimal' }
        verified_saving: { $ref: '#/components/schemas/NullableDecimal' }
        hash: { type: string }
        created_at: { type: string, format: date-time }
        writer_role: { type: string }
    CapacityAssessmentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CapacityAssessment' } }
        next_cursor: { type: string, nullable: true }
    TelemetrySyncJob:
      type: object
      required: [id, tenant_id, connection_id, revision_id, request_hash, start, end, history_days, created_at, status, attempts, next_attempt, receipt_ids, updated_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        connection_id: { type: string }
        revision_id: { type: string }
        request_hash: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        history_days: { type: integer, enum: [14, 30, 90] }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, RUNNING, RETRY, COMPLETED, BLOCKED] }
        attempts: { type: integer, minimum: 0 }
        next_attempt: { type: string, format: date-time }
        receipt_id: { type: string, nullable: true }
        receipt_ids: { type: array, items: { type: string } }
        reason_code: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
    NativeResourceBinding:
      type: object
      required: [tenant_id, resource_id, workload_id, provider, provider_resource_id, account_id, region]
      properties:
        tenant_id: { type: string }
        resource_id: { type: string }
        workload_id: { type: string }
        provider: { type: string }
        provider_resource_id: { type: string }
        account_id: { type: string }
        region: { type: string }
    TelemetryDefinition:
      type: object
      additionalProperties: false
      required: [id, version, metric, name, unit, type, monotonic, cadence_seconds, max_gap_seconds, attributes, resource_attributes]
      properties:
        id: { type: string }
        version: { type: string }
        metric: { type: string }
        name: { type: string, description: Exact registered native metric name }
        unit: { type: string, minLength: 1, maxLength: 128, description: Exact native unit spelling; registration performs no implicit conversion }
        type: { type: string, enum: [GAUGE, SUM, HISTOGRAM] }
        monotonic: { type: boolean }
        cadence_seconds: { type: integer, minimum: 1, maximum: 300 }
        max_gap_seconds: { type: integer, minimum: 1, maximum: 600, description: At least cadence_seconds }
        attributes: { type: object, maxProperties: 32, additionalProperties: { type: string } }
        resource_attributes: { type: object, maxProperties: 32, additionalProperties: { type: string } }
        epoch_metric: { type: string }
        epoch_attributes: { type: object, maxProperties: 32, additionalProperties: { type: string } }
    TelemetryConnectionRequest:
      type: object
      additionalProperties: false
      required: [resource_id, kind, definitions]
      properties:
        resource_id: { type: string }
        kind: { type: string, enum: [PROMETHEUS, OTLP] }
        read_binding_id: { type: string, description: Approved server-side Prometheus endpoint binding; credentials and URLs are never supplied here }
        subject: { type: string, description: Exact registered OTLP machine subject }
        definitions: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/TelemetryDefinition' } }
    TelemetryConnection:
      type: object
      required: [schema_version, id, version, kind, binding, enabled, definitions, config_hash, revision_id, revoked]
      properties:
        schema_version: { type: string, enum: ['1'] }
        id: { type: string }
        version: { type: integer, minimum: 1 }
        kind: { type: string, enum: [PROMETHEUS, OTLP] }
        read_binding_id: { type: string }
        issuer: { type: string }
        subject: { type: string }
        binding: { $ref: '#/components/schemas/NativeResourceBinding' }
        enabled: { type: boolean }
        definitions: { type: array, items: { $ref: '#/components/schemas/TelemetryDefinition' } }
        config_hash: { type: string }
        revision_id: { type: string }
        revoked: { type: boolean }
        created_at: { type: string, format: date-time }
        writer_role: { type: string }
    TelemetryConnectionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TelemetryConnection' } }
        next_cursor: { type: string, nullable: true }
    TelemetryDefinitionPage:
      type: object
      required: [items, next_cursor, connection_id, config_hash]
      properties:
        items: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/TelemetryDefinition' } }
        next_cursor: { type: string, nullable: true }
        connection_id: { type: string }
        config_hash: { type: string }
    NativeHistogram:
      type: object
      required: [count, bounds, bucket_counts]
      properties:
        count: { type: string, pattern: '^[0-9]+$' }
        bounds: { type: array, items: { type: string } }
        bucket_counts: { type: array, items: { type: string, pattern: '^[0-9]+$' }, description: Disjoint bucket counts, including the final positive-infinity population }
    NativeMetricResult:
      type: object
      required: [definition_id, metric, unit, status, reason_codes, start, end, observed_samples, expected_samples, coverage_ppm, observed_duration_ns, unknown_duration_ns, p50, p90, p95, p99, p999, maximum, total, segment_ids, segment_count, segment_hash, segment_ids_truncated, statistic]
      properties:
        definition_id: { type: string }
        metric: { type: string }
        unit: { type: string }
        status: { type: string }
        reason_codes: { type: array, items: { type: string } }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        observed_samples: { type: integer, minimum: 0 }
        expected_samples: { type: integer, minimum: 0 }
