        '200':
          description: Existing approved binding identifiers
          content: { application/json: { schema: { $ref: '#/components/schemas/EKSApprovedBindingList' } } }
  /resources/{id}/eks-association:
    get:
      operationId: getEKSKubernetesAssociation
      description: Currentness of an immutable point-in-time association between native EKS and observed Kubernetes identities. Managed nodes require native ASG and EC2 membership; Fargate requires observed running placement and an exact active native profile. Relationships add no costs or execution authority. Declaration names alone are insufficient.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Association evidence or explicit collection blocker
          content: { application/json: { schema: { $ref: '#/components/schemas/EKSKubernetesAssociation' } } }
        '403': { description: Current workload access denied }
        '404': { description: Resource unavailable in this tenant }
        '422': { description: An observed EKS cluster is required }
  /source-connections:
    get:
      operationId: listSourceConnections
      responses:
        '200':
          description: Tenant source health and trusted ingestion status
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SourceConnection' } }
    post:
      operationId: registerSourceConnection
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceConnectionRequest' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '201': { description: AWS location registered; trust requires successful independent ingestion } }
  /source-connections/{id}:
    get:
      operationId: inspectSourceConnection
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Registration, immutable receipts and source-specific blockers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceConnection' }
  /source-connections/{id}/sync:
    post:
      operationId: syncSourceConnection
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '202': { description: Durable ingestion request queued; no execution permission granted } }
  /source-connections/{id}/revoke:
    post:
      operationId: revokeSourceConnection
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '202': { description: New stops blocked; existing owned restoration remains authorized } }
  /activity-sources:
    get:
      operationId: listActivitySources
      responses: { '200': { description: Registered independent workload collectors } }
    post:
      operationId: registerActivitySource
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivitySourceRequest' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '201': { description: Exact machine subject and metric definition registered for the resource } }
  /activity/intervals:
    post:
      operationId: ingestActivityInterval
      description: Served by the isolated activity-ingress service. Dedicated machine OIDC audience required; console tokens cannot authorize ingestion. Sequence and content hash provide idempotency.
      security: [ { activityMachineAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityInterval' }
      responses: { '201': { description: Authenticated immutable minute observation }, '200': { description: Exact replay }, '409': { description: Conflicting sequence or interval }, '422': { description: Stale, incomplete or incorrectly bound observation } }
  /dashboard:
    get:
      operationId: dashboard
      responses:
        '200':
          description: Current tenant dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
  /cloud-accounts:
    post:
      operationId: connectAccount
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectAccountRequest' }
      responses:
        '413': { $ref: '#/components/responses/MutationBodyTooLarge' }
        '201':
          description: Account connected and read-only inventory discovered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloudAccount' }
  /recommendations:
    get:
      operationId: listRecommendations
      parameters:
        - name: model_kind
          in: query
          schema: { type: string, enum: [DATABASE_ASSESSMENT_V1, STORAGE_ASSESSMENT_V1, OBJECT_STORAGE_ASSESSMENT_V1, NETWORK_ASSESSMENT_V1, LAMBDA_ASSESSMENT_V1, AWS_SERVICE_ASSESSMENT_V1] }
        - name: resource_id
          in: query
          description: Exact resource filter for database or storage publication pages; required for a scoped application owner. Legacy unfiltered recommendations retain their existing array response.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Existing recommendation array, or scoped immutable database or storage publication page when model_kind is selected. Currentness is server-derived.
          content:
            application/json:
              schema:
                oneOf:
                  - { type: array, items: { $ref: '#/components/schemas/Recommendation' } }
                  - { $ref: '#/components/schemas/DatabaseRecommendationPage' }
        '403': { description: Requested resource or financial scope is not available to the authenticated actor. }
    post:
      operationId: generateRecommendations
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '201': { description: Recommendations generated } }
  /workloads:
    post:
      operationId: createWorkload
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '201': { description: Non-production workload with owner and mandatory health URL created; signals initially UNKNOWN } }
  /policies/{id}:
    post:
      operationId: updatePolicy
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '200': { description: Scoped workload_autopilot_ids and pause updated; temporary Autopilot grant expires in 30 days } }
  /resources/{id}/configure:
    post:
      operationId: configureResource
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '200': { description: Explicit workload mapping and field-specific runtime delegation configured } }
  /billing/import:
    post:
      operationId: importBilling
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingImportRequest' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '202': { description: AWS CUR 2.0 source records normalized and queued for immutable persistence. Caller supplied economic evidence flags are rejected. } }
  /resources/{id}/readiness:
    get:
      operationId: resourceReadiness
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Fresh operational assessment bound to the latest sealed readiness report. Reports expire after five minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /resources/{id}/readiness/refresh:
    post:
      operationId: refreshReadiness
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses:
        '413': { $ref: '#/components/responses/MutationBodyTooLarge' }
        '201':
          description: Immutable baseline and operational readiness assessment sealed. Generate recommendations to use this report in a plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /evidence/baselines:
    post:
      operationId: sealBaseline
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BaselineRequest' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '201': { description: Immutable source-bound baseline sealed; requires at least fourteen complete local days and validated idle-workload evidence } }
  /evidence/measurements:
    post:
      operationId: sealMeasurement
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasurementRequest' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '201': { description: Immutable measurement snapshot sealed against the signed reservation; costs and invoice reconciliation derive from its persisted canonical source } }
  /schedules:
    post:
      operationId: createSchedule
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScheduleRequest' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '201': { description: Approved schedule definition created } }
  /change-plans:
    post:
      operationId: createPlan
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlanRequest' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '201': { description: Immutable resource occurrence plan awaiting approval } }
  /approvals:
    post:
      operationId: approvePlan
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - change_plan_id
                  properties:
                    change_plan_id:
                      type: string
                  not:
                    anyOf:
                      - required:
                          - commitment_decision_id
                      - required:
                          - decision_sha256
                - $ref: '#/components/schemas/CommitmentDecisionFinanceReviewRequest'
      responses:
        '201':
          description: >-
            Existing plan approval or exact immutable commitment recommendation Finance review. The latter never authorizes
            purchase or execution.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CommitmentDecisionFinanceReviewResponse'
                  - type: object
                    required:
                      - approval
                      - change_plan
                    additionalProperties: true
                    properties:
                      approval:
                        type: object
                      change_plan:
                        type: object
        '403':
          description: Finance role, independent reviewer and workload scope required for a commitment target.
        '409':
          description: Review/version conflict or changed immutable target.
        '413':
          $ref: '#/components/responses/MutationBodyTooLarge'
        '422':
          description: Mixed target, invalid hash or no longer current input closure.
  /executions:
    post:
      operationId: executePlan
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/PlanReference' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '202': { description: Durable stop and restoration occurrence queued } }
  /executions/{id}/start-now:
    post:
      operationId: restoreNow
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '202': { description: Owned restoration requested; pause never cancels restoration } }
  /schedules/{id}/pause:
    post:
      operationId: pauseSchedule
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '200': { description: Schedule paused or resumed } }
  /schedules/{id}/skip-next-stop:
    post:
      operationId: skipStop
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '200': { description: Next stop will be skipped } }
  /workloads/{id}/signals:
    post:
      operationId: updateSignals
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '200': { description: Fresh explicit incident/deployment/job signals recorded } }
  /control/pause:
    post:
      operationId: pauseAutopilot
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '200': { description: New stops blocked; recovery remains authorized } }
  /savings/verify:
    post:
      operationId: verifySavings
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '200': { description: Append verified or provisional evidence; negative values preserved } }
  /demo/reset:
    post:
      operationId: resetFixture
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '200': { description: Fixture-only reset; audit and ledger retained } }
  /demo/scenario:
    post:
      operationId: fixtureScenario
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { $ref: '#/components/requestBodies/Document' }
      responses: { '413': { $ref: '#/components/responses/MutationBodyTooLarge' }, '200': { description: Fixture healthy/incident/job/deployment/stale/unhealthy scenario selected } }
components:
  responses:
    MutationBodyTooLarge:
      description: Complete control-plane request exceeds 4 MiB; no idempotency key or mutation is committed.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error, message]
            properties:
              error: { type: string, enum: [BODY_TOO_LARGE] }
              message: { type: string, enum: [request body exceeds 4 MiB] }
  securitySchemes:
    deploymentMachineAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: Dedicated finops-deployment-observer audience and exact registered machine issuer/subject; no human roles }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    activityMachineAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: Dedicated finops-activity audience and registered machine subject }
  parameters:
    PageLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    PageCursor: { name: cursor, in: query, schema: { type: string }, description: Opaque tenant/query-bound cursor; never derive it from resource contents }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string }, description: Quoted current integer version ETag; stale updates return 409. }
  requestBodies:
    Document:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Document' }
    PlanReference:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [change_plan_id]
            properties:
              change_plan_id: { type: string }
  schemas:
    DatabaseLimits:
      type: object
      additionalProperties: false
      required: [connections_max_fraction, iops_max_fraction, throughput_max_fraction, storage_max_fraction, max_read_latency_seconds, max_write_latency_seconds, max_disk_queue_depth, max_replica_lag_seconds]
      properties:
        connections_max_fraction: { $ref: '#/components/schemas/Decimal' }
        iops_max_fraction: { $ref: '#/components/schemas/Decimal' }
        throughput_max_fraction: { $ref: '#/components/schemas/Decimal' }
        storage_max_fraction: { $ref: '#/components/schemas/Decimal' }
        max_read_latency_seconds: { $ref: '#/components/schemas/Decimal' }
        max_write_latency_seconds: { $ref: '#/components/schemas/Decimal' }
        max_disk_queue_depth: { $ref: '#/components/schemas/Decimal' }
        max_replica_lag_seconds: { $ref: '#/components/schemas/Decimal' }
    StorageLimits:
      type: object
      additionalProperties: false
      description: Optional customer storage requirements. These declarations are not native observations, dependency proof, backup proof or permission to change storage. Null booleans retain unknown requirements.
      required: [iops_max_fraction, throughput_max_fraction, max_read_latency_seconds, max_write_latency_seconds, max_disk_queue_depth, min_burst_balance_percent, snapshot_retention_days, quarantine_days, backup_required, allow_durability_reduction, require_multi_attach, filesystem_review_required]
      properties:
        iops_max_fraction: { $ref: '#/components/schemas/Decimal' }
        throughput_max_fraction: { $ref: '#/components/schemas/Decimal' }
        max_read_latency_seconds: { $ref: '#/components/schemas/Decimal' }
        max_write_latency_seconds: { $ref: '#/components/schemas/Decimal' }
        max_disk_queue_depth: { $ref: '#/components/schemas/Decimal' }
        min_burst_balance_percent: { $ref: '#/components/schemas/Decimal' }
        snapshot_retention_days: { type: integer, minimum: 1, maximum: 36500 }
        quarantine_days: { type: integer, minimum: 1, maximum: 36500 }
        backup_required: { type: boolean, nullable: true }
        allow_durability_reduction: { type: boolean, nullable: true }
        require_multi_attach: { type: boolean, nullable: true }
        filesystem_review_required: { type: boolean, nullable: true }
    LambdaPerformanceBatch:
      description: Machine-only benchmark ingress. Version 1 remains legacy evidence; only version 2 with independently resolved native proof may establish a new numerical curve.
      oneOf:
        - { $ref: '#/components/schemas/LambdaPerformanceLegacyBatch' }
        - { $ref: '#/components/schemas/LambdaPerformanceNativeBatch' }
    LambdaPerformanceLegacyBatch:
      type: object
      additionalProperties: false
      required: [schema_version, source_id, source_version, sequence, point]
      properties:
        schema_version: { type: string, enum: ['1'] }
        source_id: { type: string }
        source_version: { type: integer, minimum: 1 }
        sequence: { type: string, pattern: '^[1-9][0-9]*$' }
        point:
          type: object
          description: Customer-attested historical performance. This cannot manufacture historical activity or SLO receipt time. Native function/qualifier, code, workload definition, mix, load and configuration fingerprints must match.
          additionalProperties: false
          required: [binding, qualifier, executed_version, code_sha256, comparison_fingerprint, workload_definition_id, workload_definition_version, workload_mix_hash, load_profile_hash, architecture, measurement_start, measurement_end, memory_size_mb, invocations, successful_work, errors, throttles, total_duration_ms, total_billed_duration_ms]
          properties:
            binding: { $ref: '#/components/schemas/StorageAssessmentObject' }
            qualifier: { type: string }
            executed_version: { type: string }
            code_sha256: { type: string }
            comparison_fingerprint: { type: string }
            workload_definition_id: { type: string }
            workload_definition_version: { type: string }
            workload_mix_hash: { type: string }
            load_profile_hash: { type: string }
            architecture: { type: string, enum: [x86_64, arm64] }
            measurement_start: { type: string, format: date-time }
            measurement_end: { type: string, format: date-time }
            memory_size_mb: { $ref: '#/components/schemas/Decimal' }
            invocations: { $ref: '#/components/schemas/Decimal' }
            successful_work: { $ref: '#/components/schemas/Decimal' }
            errors: { $ref: '#/components/schemas/Decimal' }
            throttles: { $ref: '#/components/schemas/Decimal' }
            total_duration_ms: { $ref: '#/components/schemas/Decimal' }
            total_billed_duration_ms: { $ref: '#/components/schemas/Decimal' }
            p95_duration_ms: { $ref: '#/components/schemas/NullableDecimal' }
            p99_duration_ms: { $ref: '#/components/schemas/NullableDecimal' }
            max_memory_used_mb: { $ref: '#/components/schemas/NullableDecimal' }
            peak_concurrent_executions: { $ref: '#/components/schemas/NullableDecimal' }
            p95_application_latency_ms: { $ref: '#/components/schemas/NullableDecimal' }
            cold_start_p95_ms: { $ref: '#/components/schemas/NullableDecimal' }
    LambdaPerformanceNativeBatch:
      type: object
      additionalProperties: false
      required: [schema_version, source_id, source_version, sequence, point]
      properties:
        schema_version: { type: string, enum: ['2'] }
        source_id: { type: string }
        source_version: { type: integer, minimum: 1 }
        sequence: { type: string, pattern: '^[1-9][0-9]*$' }
        point:
          type: object
          description: Customer-attested historical performance. This cannot manufacture historical activity or SLO receipt time. Native function/qualifier, code, workload definition, mix, load and configuration fingerprints must match.
          additionalProperties: false
          required: [native_configuration_ref, executed_target_arn, configuration_epoch_hash, non_memory_compatibility, binding, qualifier, executed_version, code_sha256, comparison_fingerprint, workload_definition_id, workload_definition_version, workload_mix_hash, load_profile_hash, architecture, measurement_start, measurement_end, memory_size_mb, invocations, successful_work, errors, throttles, total_duration_ms, total_billed_duration_ms]
          properties:
            native_configuration_ref:
              type: object
              additionalProperties: false
              required: [snapshot_id, content_hash, config_hash]
              properties:
                snapshot_id: { type: string }
                content_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
                config_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
            executed_target_arn: { type: string, description: Exact published numeric executed-version ARN; registration qualifier remains comparison scope. }
            configuration_epoch_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
            non_memory_compatibility:
              type: object
              additionalProperties: false
              required: [definition_version, sha256, dependency_manifest_sha256]
              properties:
                definition_version: { type: string, enum: [LAMBDA_NON_MEMORY_CONFIG_V1] }
                sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                dependency_manifest_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            binding: { $ref: '#/components/schemas/StorageAssessmentObject' }
            qualifier: { type: string }
            executed_version: { type: string }
            code_sha256: { type: string }
            comparison_fingerprint: { type: string }
            workload_definition_id: { type: string }
            workload_definition_version: { type: string }
            workload_mix_hash: { type: string }
            load_profile_hash: { type: string }
            architecture: { type: string, enum: [x86_64, arm64] }
            measurement_start: { type: string, format: date-time }
            measurement_end: { type: string, format: date-time }
            memory_size_mb: { $ref: '#/components/schemas/Decimal' }
            invocations: { $ref: '#/components/schemas/Decimal' }
            successful_work: { $ref: '#/components/schemas/Decimal' }
            errors: { $ref: '#/components/schemas/Decimal' }
            throttles: { $ref: '#/components/schemas/Decimal' }
            total_duration_ms: { $ref: '#/components/schemas/Decimal' }
            total_billed_duration_ms: { $ref: '#/components/schemas/Decimal' }
            p95_duration_ms: { $ref: '#/components/schemas/NullableDecimal' }
            p99_duration_ms: { $ref: '#/components/schemas/NullableDecimal' }
            max_memory_used_mb: { $ref: '#/components/schemas/NullableDecimal' }
            peak_concurrent_executions: { $ref: '#/components/schemas/NullableDecimal' }
            p95_application_latency_ms: { $ref: '#/components/schemas/NullableDecimal' }
