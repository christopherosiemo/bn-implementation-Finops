      required: [schema_version, source_id, resource_id, workload_id, sequence, interval_start, interval_end, metric_definition, accepted, completed, rejected, backlog, inflight, heartbeat, incident, deployment, job]
      properties:
        schema_version: { type: string, enum: ['1'] }
        source_id: { type: string }
        resource_id: { type: string }
        workload_id: { type: string }
        sequence: { type: integer, minimum: 1 }
        interval_start: { type: string, format: date-time }
        interval_end: { type: string, format: date-time }
