      required: [id, reason, start, end]
      properties:
        id: { type: string }
        reason: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    SafetyDemandEvent:
      type: object
      additionalProperties: false
      required: [id, reason, start, end, demand_multiplier_ppm]
      properties:
        id: { type: string }
        reason: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        demand_multiplier_ppm: { type: integer, minimum: 1000000, maximum: 1000000000 }
    AWSServiceLimits:
      type: object
      additionalProperties: false
      description: Optional customer requirements only; these declarations establish no observation, successful recovery or execution authority.
      properties:
        cpu_headroom_fraction: { $ref: '#/components/schemas/NullableDecimal' }
        memory_headroom_fraction: { $ref: '#/components/schemas/NullableDecimal' }
        cpu_max_fraction: { $ref: '#/components/schemas/NullableDecimal' }
        memory_max_fraction: { $ref: '#/components/schemas/NullableDecimal' }
        read_target_utilization_fraction: { $ref: '#/components/schemas/NullableDecimal' }
        write_target_utilization_fraction: { $ref: '#/components/schemas/NullableDecimal' }
        min_read_capacity_units: { $ref: '#/components/schemas/NullableDecimal' }
        min_write_capacity_units: { $ref: '#/components/schemas/NullableDecimal' }
        max_replication_lag_seconds: { $ref: '#/components/schemas/NullableDecimal' }
        max_swap_bytes: { $ref: '#/components/schemas/NullableDecimal' }
        max_evictions: { $ref: '#/components/schemas/NullableDecimal' }
        min_replicas_per_shard: { $ref: '#/components/schemas/NullableDecimal' }
        low_requests_per_second: { $ref: '#/components/schemas/NullableDecimal' }
        low_bytes_per_second: { $ref: '#/components/schemas/NullableDecimal' }
        max_error_rate: { $ref: '#/components/schemas/NullableDecimal' }
        max_latency_ms: { $ref: '#/components/schemas/NullableDecimal' }
        max_queue_age_ms: { $ref: '#/components/schemas/NullableDecimal' }
        burst_requirements_known: { type: boolean, nullable: true }
        autoscaling_reviewed: { type: boolean, nullable: true }
        failover_required: { type: boolean, nullable: true }
        disaster_recovery_required: { type: boolean, nullable: true }
        recovery_requirements_known: { type: boolean, nullable: true }
        purpose: { type: string, enum: [UNKNOWN, ACTIVE, FAILOVER, DR, MAINTENANCE, PRIVATE_INTEGRATION] }
    WorkloadSafetyRequest:
      type: object
      additionalProperties: false
      required: [schema_version, criticality, statefulness, high_seasonality, timezone, min_replicas, min_zones, headroom, saturation, rto_seconds, rpo_seconds, maintenance, recurring_blackouts, blackouts, demand_events, max_simultaneous_change_ppm, vm_cooldown_seconds]
      properties:
        aws_service: { $ref: '#/components/schemas/AWSServiceLimits' }
        database: { $ref: '#/components/schemas/DatabaseLimits' }
        storage: { $ref: '#/components/schemas/StorageLimits' }
        schema_version: { type: string, enum: ['1'] }
        criticality: { type: string, enum: [TIER_0, TIER_1, TIER_2, TIER_3, NON_PRODUCTION] }
        statefulness: { type: string, enum: [STATELESS, STATEFUL, UNKNOWN] }
        high_seasonality: { type: boolean }
        timezone: { type: string, description: Explicit IANA timezone }
        min_replicas: { type: integer, minimum: 1, maximum: 1000000 }
        min_zones: { type: integer, minimum: 1, maximum: 100, description: No greater than min_replicas }
        headroom:
          type: object
          additionalProperties: false
          required: [cpu_free_ppm, memory_free_ppm, reserve_above_forecast_ppm]
          properties:
            cpu_free_ppm: { type: integer, minimum: 1, maximum: 999999, description: Unused capacity fraction; 300000 means utilization at most 70% }
            memory_free_ppm: { type: integer, minimum: 1, maximum: 999999 }
            reserve_above_forecast_ppm: { type: integer, minimum: 0, maximum: 10000000, description: Additive reserve; 300000 requires capacity at least forecast times 1.30 }
        saturation:
          type: object
          additionalProperties: false
          required: [cpu_p99_ppm, memory_p99_ppm]
          properties:
            cpu_p99_ppm: { type: integer, minimum: 1, maximum: 1000000 }
            memory_p99_ppm: { type: integer, minimum: 1, maximum: 1000000 }
        rto_seconds: { type: integer, minimum: 1, maximum: 604800 }
        rpo_seconds: { type: integer, nullable: true, minimum: 0, maximum: 604800, description: Null means unknown, never an observed recovery achievement }
        maintenance: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/SafetyWeeklyWindow' } }
        recurring_blackouts: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/SafetyWeeklyWindow' } }
        blackouts: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/SafetyBlackout' } }
        demand_events: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/SafetyDemandEvent' } }
        max_simultaneous_change_ppm: { type: integer, minimum: 1, maximum: 1000000 }
        vm_cooldown_seconds: { type: integer, minimum: 0, maximum: 31536000 }
    WorkloadSafetyProfile:
      type: object
      required: [id, workload_id, version, hash, schema_version, criticality, statefulness, high_seasonality, timezone, min_replicas, min_zones, headroom, saturation, rto_seconds, rpo_seconds, maintenance, recurring_blackouts, blackouts, demand_events, max_simultaneous_change_ppm, vm_cooldown_seconds]
      properties:
        aws_service: { $ref: '#/components/schemas/AWSServiceLimits' }
        database: { $ref: '#/components/schemas/DatabaseLimits' }
        storage: { $ref: '#/components/schemas/StorageLimits' }
        id: { type: string }
        workload_id: { type: string }
        version: { type: integer, minimum: 1 }
        hash: { type: string }
        created_at: { type: string, format: date-time }
        writer_role: { type: string }
        schema_version: { type: string, enum: ['1'] }
        criticality: { $ref: '#/components/schemas/WorkloadSafetyRequest/properties/criticality' }
        statefulness: { $ref: '#/components/schemas/WorkloadSafetyRequest/properties/statefulness' }
        high_seasonality: { type: boolean }
        timezone: { type: string }
        min_replicas: { type: integer }
        min_zones: { type: integer }
        headroom: { $ref: '#/components/schemas/WorkloadSafetyRequest/properties/headroom' }
        saturation: { $ref: '#/components/schemas/WorkloadSafetyRequest/properties/saturation' }
        rto_seconds: { type: integer }
        rpo_seconds: { type: integer, nullable: true }
        maintenance: { type: array, items: { $ref: '#/components/schemas/SafetyWeeklyWindow' } }
        recurring_blackouts: { type: array, items: { $ref: '#/components/schemas/SafetyWeeklyWindow' } }
        blackouts: { type: array, items: { $ref: '#/components/schemas/SafetyBlackout' } }
        demand_events: { type: array, items: { $ref: '#/components/schemas/SafetyDemandEvent' } }
        max_simultaneous_change_ppm: { type: integer }
        vm_cooldown_seconds: { type: integer }
    WorkloadSafetyPage:
      type: object
      required: [version, latest, items, next_cursor]
      properties:
        version: { type: integer, minimum: 0 }
        latest:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/WorkloadSafetyProfile' } ]
        items: { type: array, items: { $ref: '#/components/schemas/WorkloadSafetyProfile' } }
        next_cursor: { type: string, nullable: true }
    WorkloadSafetyEvaluation:
      type: object
      required: [workload_id, status, reason_codes]
      properties:
        workload_id: { type: string }
        status: { type: string, enum: [CLEAR, BLOCKED] }
        reason_codes: { type: array, items: { type: string } }
        requirements_only: { type: boolean, enum: [true] }
        execution_authorized: { type: boolean, enum: [false] }
        recovery_evidence_status: { type: string, enum: [UNAVAILABLE] }
        profile: { $ref: '#/components/schemas/WorkloadSafetyProfile' }
        window:
          type: object
          properties:
            status: { type: string }
            reason_codes: { type: array, items: { type: string } }
            profile_hash: { type: string }
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
    SloLimits:
      type: object
      additionalProperties: false
      required: [max_error_rate_ppm, min_availability_ppm, max_p95_latency_ms, max_p99_latency_ms, min_latency_samples]
      properties:
        max_error_rate_ppm: { type: integer, minimum: 0, maximum: 1000000, description: Absolute hard maximum in parts per million }
        min_availability_ppm: { type: integer, minimum: 0, maximum: 1000000, description: Absolute hard minimum in parts per million }
        max_p95_latency_ms: { type: integer, minimum: 1, maximum: 86400000 }
        max_p99_latency_ms: { type: integer, minimum: 1, maximum: 86400000, description: Must be greater than or equal to the p95 limit }
        min_latency_samples: { type: integer, minimum: 1, maximum: 1000000000000, description: Minimum request observations for latency evaluation; insufficient samples never become zero latency }
    SloAvailabilityWindow:
      type: object
      additionalProperties: false
      required: [days, start_time, end_time]
      properties:
        days: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 }, description: Sunday is zero }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Must be later than start_time; overnight windows are unsupported }
    SloAvailability:
      type: object
      additionalProperties: false
      required: [mode, timezone, windows]
      properties:
        mode: { type: string, enum: [ALWAYS, WINDOWS], description: ALWAYS blocks a standalone singleton STOP. WINDOWS requires the whole stop-to-readiness interval outside the declared availability windows. }
        timezone: { type: string, description: Explicit IANA timezone }
        windows: { type: array, nullable: true, maxItems: 32, items: { $ref: '#/components/schemas/SloAvailabilityWindow' }, description: Empty or null for ALWAYS; an actual nonempty same-day array is required for WINDOWS. Null never proves WINDOWS availability. }
    SloRegression:
      type: object
      additionalProperties: false
      required: [enabled, max_percent]
      properties:
        enabled: { type: boolean, description: Requires a measurable frozen server-selected pre-plan latency baseline when enabled }
        max_percent: { type: integer, minimum: 0, maximum: 1000, description: Independent maximum latency regression percentage; cannot waive a hard limit }
    SloObjectiveRequest:
      type: object
      additionalProperties: false
      required: [schema_version, limits, evaluation_minutes, availability, regression]
      properties:
        schema_version: { type: string, enum: ['1'] }
        limits: { $ref: '#/components/schemas/SloLimits' }
        evaluation_minutes: { type: integer, minimum: 2, maximum: 60 }
        availability: { $ref: '#/components/schemas/SloAvailability' }
        regression: { $ref: '#/components/schemas/SloRegression' }
    SloObjective:
      type: object
      required: [schema_version, limits, evaluation_minutes, availability, regression, id, workload_id, version, hash, created_at]
      properties:
        schema_version: { type: string, enum: ['1'] }
        limits: { $ref: '#/components/schemas/SloLimits' }
        evaluation_minutes: { type: integer, minimum: 2, maximum: 60 }
        availability: { $ref: '#/components/schemas/SloAvailability' }
        regression: { $ref: '#/components/schemas/SloRegression' }
        id: { type: string }
        workload_id: { type: string }
        version: { type: integer, minimum: 1 }
        hash: { type: string }
        created_at: { type: string, format: date-time }
        writer_role: { type: string }
    SloObjectiveHistory:
      type: object
      required: [version, latest, history]
      properties:
        version: { type: integer, minimum: 0 }
        latest:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/SloObjective' } ]
        history: { type: array, items: { $ref: '#/components/schemas/SloObjective' } }
    SloSourceRequest:
      type: object
      additionalProperties: false
      required: [objective_id, resource_id, subject]
      properties:
        objective_id: { type: string }
        resource_id: { type: string }
        subject: { type: string, description: Exact dedicated machine OIDC subject; no credentials }
    SloSource:
      type: object
      required: [schema_version, id, objective_id, resource_id, subject, workload_id, provider_resource_id, account_id, region, issuer, enabled]
      properties:
        schema_version: { type: string, enum: ['1'] }
        id: { type: string }
        objective_id: { type: string }
        resource_id: { type: string }
        subject: { type: string }
        workload_id: { type: string }
        provider_resource_id: { type: string }
        account_id: { type: string }
        region: { type: string }
        issuer: { type: string }
        enabled: { type: boolean }
    SloCheck:
      type: object
      required: [name, status, reason_code]
      properties:
        name: { type: string }
        status: { type: string, enum: [PASS, FAIL, INDETERMINATE, NOT_APPLICABLE] }
        reason_code: { type: string }
    SloEvaluation:
      type: object
      description: Missing objective, source or binding produces only a blocked status and reasons. Observability fields are absent until independently observed; partial coverage cannot establish complete-window request counts, rates or latency.
      required: [status, reason_codes]
      properties:
        id: { type: string }
        evaluation_hash: { type: string }
        status: { type: string, enum: [CLEAR, BLOCKED] }
        reason_codes: { type: array, items: { type: string } }
        objective_id: { type: string }
        objective_version: { type: integer, minimum: 0 }
        objective_hash: { type: string }
        source_id: { type: string }
        source_hash: { type: string }
        resource_id: { type: string }
        workload_id: { type: string }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        expected_intervals: { type: integer, minimum: 0 }
        observed_intervals: { type: integer, minimum: 0 }
        coverage_ppm: { type: integer, minimum: 0, maximum: 1000000 }
        request_count: { type: integer, minimum: 0 }
        error_count: { type: integer, minimum: 0 }
        availability_good_seconds: { type: integer, minimum: 0 }
        availability_total_seconds: { type: integer, minimum: 0 }
        error_rate_ppm: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }
        availability_ppm: { type: integer, nullable: true, minimum: 0, maximum: 1000000 }
        latency_samples: { type: integer, minimum: 0 }
        p95_latency_ms: { type: integer, nullable: true, minimum: 0, description: Histogram upper bound; unavailable for no demand or insufficient observations }
        p99_latency_ms: { type: integer, nullable: true, minimum: 0 }
        p95_lower_ms: { type: integer, nullable: true, minimum: 0 }
        p99_lower_ms: { type: integer, nullable: true, minimum: 0 }
        latency_status: { type: string, enum: [OBSERVED, NO_DEMAND, INSUFFICIENT] }
        hard_checks: { type: array, items: { $ref: '#/components/schemas/SloCheck' } }
        regression_checks: { type: array, items: { $ref: '#/components/schemas/SloCheck' } }
        receipt_ids: { type: array, items: { type: string } }
        baseline_evaluation_id: { type: string }
        baseline_evaluation_hash: { type: string }
    SloHistogramBucket:
      type: object
      additionalProperties: false
      required: [upper_bound_ms, count]
      properties:
        upper_bound_ms: { type: integer, nullable: true, minimum: 0, maximum: 86400000, description: Strictly increasing finite millisecond bounds; the last bucket alone has null for positive infinity }
        count: { type: integer, minimum: 0, maximum: 1000000000000, description: Non-cumulative bucket count }
    SloHistogram:
      type: object
      additionalProperties: false
      required: [unit, buckets, sample_count]
      properties:
        unit: { type: string, enum: [milliseconds] }
        buckets: { type: array, minItems: 1, maxItems: 256, items: { $ref: '#/components/schemas/SloHistogramBucket' } }
        sample_count: { type: integer, minimum: 0, maximum: 1000000000000, description: Equals request_count and the sum of all non-cumulative bucket counts }
    SloInterval:
      type: object
      additionalProperties: false
      required: [schema_version, source_id, objective_id, workload_id, resource_id, sequence, interval_start, interval_end, request_count, error_count, availability_good_seconds, availability_total_seconds, latency]
      properties:
        schema_version: { type: string, enum: ['1'] }
        source_id: { type: string }
        objective_id: { type: string }
        workload_id: { type: string }
        resource_id: { type: string }
        sequence: { type: integer, minimum: 1 }
        interval_start: { type: string, format: date-time, description: Exact UTC minute boundary }
        interval_end: { type: string, format: date-time, description: Exactly sixty seconds after interval_start }
        request_count: { type: integer, minimum: 0, maximum: 1000000000000 }
        error_count: { type: integer, minimum: 0, maximum: 1000000000000, description: No greater than request_count }
        availability_good_seconds: { type: integer, minimum: 0, maximum: 60 }
        availability_total_seconds: { type: integer, enum: [60] }
        latency: { $ref: '#/components/schemas/SloHistogram' }
    SloEvaluationSnapshot:
      type: object
      required: [resource_id, workload_id, objective, source, evaluation]
      properties:
        resource_id: { type: string }
        workload_id: { type: string }
        objective:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/SloObjective' } ]
        source:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/SloSource' } ]
        evaluation: { $ref: '#/components/schemas/SloEvaluation' }
