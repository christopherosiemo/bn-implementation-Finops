                required: [status, reason_code, required_maximum_ppm, future_breach_probability_upper_ppm]
                properties:
                  status: { type: string, enum: [UNCALIBRATED] }
                  reason_code: { type: string }
                  required_maximum_ppm: { type: integer }
                  future_breach_probability_upper_ppm: { type: integer, nullable: true, enum: [null] }
        evidence_refs: { type: array, items: { $ref: '#/components/schemas/CapacityModelReference' } }
        model_assumptions: { type: array, items: { type: string } }
        assessment_hash: { type: string }
