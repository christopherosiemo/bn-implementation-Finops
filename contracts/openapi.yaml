      properties:
        id: { type: string }
        connection_id: { type: string }
        config_hash: { type: string }
        revision_id: { type: string }
        receipt_ids: { type: array, items: { type: string } }
        evaluation: { $ref: '#/components/schemas/NativeTelemetryEvaluation' }
        hash: { type: string }
        created_at: { type: string, format: date-time }
    TelemetryEvaluationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TelemetryEvaluationRecord' } }
        next_cursor: { type: string, nullable: true }
    TelemetryReceipt:
      type: object
      required: [id, batch_id, connection_id, revision_id, config_hash, binding, source_kind, raw_sha256, canonical_hash, collected_at, sample_count, rejection_count, warning_count, active_source]
      properties:
        id: { type: string }
        batch_id: { type: string }
        connection_id: { type: string }
        revision_id: { type: string }
        config_hash: { type: string }
        binding: { $ref: '#/components/schemas/NativeResourceBinding' }
        source_kind: { type: string, enum: [PROMETHEUS, OTLP] }
        raw_sha256: { type: string }
        canonical_hash: { type: string }
        collected_at: { type: string, format: date-time }
