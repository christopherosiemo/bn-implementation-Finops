                  current_cost: { $ref: '#/components/schemas/NullableDecimal' }
                  candidate_cost: { $ref: '#/components/schemas/NullableDecimal' }
                  estimated_saving: { $ref: '#/components/schemas/NullableDecimal' }
                  verified_saving: { type: string, nullable: true, enum: [null] }
              future_risk:
