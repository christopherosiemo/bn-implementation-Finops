        p50: { $ref: '#/components/schemas/NullableDecimal' }
        p90: { $ref: '#/components/schemas/NullableDecimal' }
        p95: { $ref: '#/components/schemas/NullableDecimal' }
        p99: { $ref: '#/components/schemas/NullableDecimal' }
        p999: { $ref: '#/components/schemas/NullableDecimal' }
        maximum: { $ref: '#/components/schemas/NullableDecimal' }
        total: { $ref: '#/components/schemas/NullableDecimal' }
