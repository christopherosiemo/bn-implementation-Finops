    SafetyWeeklyWindow:
      type: object
      additionalProperties: false
      required: [days, start_time, end_time]
      properties:
        days: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 } }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end_time: { type: string, pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$', description: Unequal to start; an earlier end means the next local day and 24:00 means the end of the local day }
    SafetyBlackout:
      type: object
      additionalProperties: false
      required: [id, reason, start, end]
      properties:
        id: { type: string }
        reason: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    SafetyDemandEvent:
      type: object
      additionalProperties: false
      required: [id, reason, start, end, demand_multiplier_ppm]
      properties:
        id: { type: string }
        reason: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        demand_multiplier_ppm: { type: integer, minimum: 1000000, maximum: 1000000000 }
    WorkloadSafetyRequest:
      type: object
      additionalProperties: false
      required: [schema_version, criticality, statefulness, high_seasonality, timezone, min_replicas, min_zones, headroom, saturation, rto_seconds, rpo_seconds, maintenance, recurring_blackouts, blackouts, demand_events, max_simultaneous_change_ppm, vm_cooldown_seconds]
      properties:
        schema_version: { type: string, enum: ['1'] }
        criticality: { type: string, enum: [TIER_0, TIER_1, TIER_2, TIER_3, NON_PRODUCTION] }
        statefulness: { type: string, enum: [STATELESS, STATEFUL, UNKNOWN] }
        high_seasonality: { type: boolean }
        timezone: { type: string, description: Explicit IANA timezone }
        min_replicas: { type: integer, minimum: 1, maximum: 1000000 }
        min_zones: { type: integer, minimum: 1, maximum: 100, description: No greater than min_replicas }
        headroom:
          type: object
          additionalProperties: false
          required: [cpu_free_ppm, memory_free_ppm, reserve_above_forecast_ppm]
          properties:
            cpu_free_ppm: { type: integer, minimum: 1, maximum: 999999, description: Unused capacity fraction; 300000 means utilization at most 70% }
            memory_free_ppm: { type: integer, minimum: 1, maximum: 999999 }
            reserve_above_forecast_ppm: { type: integer, minimum: 0, maximum: 10000000, description: Additive reserve; 300000 requires capacity at least forecast times 1.30 }
        saturation:
          type: object
          additionalProperties: false
          required: [cpu_p99_ppm, memory_p99_ppm]
          properties:
            cpu_p99_ppm: { type: integer, minimum: 1, maximum: 1000000 }
            memory_p99_ppm: { type: integer, minimum: 1, maximum: 1000000 }
        rto_seconds: { type: integer, minimum: 1, maximum: 604800 }
        rpo_seconds: { type: integer, nullable: true, minimum: 0, maximum: 604800, description: Null means unknown, never an observed recovery achievement }
        maintenance: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/SafetyWeeklyWindow' } }
        recurring_blackouts: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/SafetyWeeklyWindow' } }
        blackouts: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/SafetyBlackout' } }
        demand_events: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/SafetyDemandEvent' } }
        max_simultaneous_change_ppm: { type: integer, minimum: 1, maximum: 1000000 }
        vm_cooldown_seconds: { type: integer, minimum: 0, maximum: 31536000 }
    WorkloadSafetyProfile:
      type: object
      required: [id, workload_id, version, hash, schema_version, criticality, statefulness, high_seasonality, timezone, min_replicas, min_zones, headroom, saturation, rto_seconds, rpo_seconds, maintenance, recurring_blackouts, blackouts, demand_events, max_simultaneous_change_ppm, vm_cooldown_seconds]
      properties:
        id: { type: string }
        workload_id: { type: string }
        version: { type: integer, minimum: 1 }
        hash: { type: string }
        created_at: { type: string, format: date-time }
        writer_role: { type: string }
        schema_version: { type: string, enum: ['1'] }
        criticality: { $ref: '#/components/schemas/WorkloadSafetyRequest/properties/criticality' }
        statefulness: { $ref: '#/components/schemas/WorkloadSafetyRequest/properties/statefulness' }
        high_seasonality: { type: boolean }
        timezone: { type: string }
        min_replicas: { type: integer }
        min_zones: { type: integer }
        headroom: { $ref: '#/components/schemas/WorkloadSafetyRequest/properties/headroom' }
        saturation: { $ref: '#/components/schemas/WorkloadSafetyRequest/properties/saturation' }
        rto_seconds: { type: integer }
        rpo_seconds: { type: integer, nullable: true }
        maintenance: { type: array, items: { $ref: '#/components/schemas/SafetyWeeklyWindow' } }
        recurring_blackouts: { type: array, items: { $ref: '#/components/schemas/SafetyWeeklyWindow' } }
        blackouts: { type: array, items: { $ref: '#/components/schemas/SafetyBlackout' } }
        demand_events: { type: array, items: { $ref: '#/components/schemas/SafetyDemandEvent' } }
        max_simultaneous_change_ppm: { type: integer }
        vm_cooldown_seconds: { type: integer }
    WorkloadSafetyPage:
      type: object
      required: [version, latest, items, next_cursor]
      properties:
        version: { type: integer, minimum: 0 }
        latest:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/WorkloadSafetyProfile' } ]
        items: { type: array, items: { $ref: '#/components/schemas/WorkloadSafetyProfile' } }
        next_cursor: { type: string, nullable: true }
    WorkloadSafetyEvaluation:
      type: object
      required: [workload_id, status, reason_codes]
      properties:
        workload_id: { type: string }
        status: { type: string, enum: [CLEAR, BLOCKED] }
        reason_codes: { type: array, items: { type: string } }
        requirements_only: { type: boolean, enum: [true] }
        execution_authorized: { type: boolean, enum: [false] }
        recovery_evidence_status: { type: string, enum: [UNAVAILABLE] }
        profile: { $ref: '#/components/schemas/WorkloadSafetyProfile' }
        window:
          type: object
          properties:
            status: { type: string }
            reason_codes: { type: array, items: { type: string } }
            profile_hash: { type: string }
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
    SloLimits:
      type: object
      additionalProperties: false
      required: [max_error_rate_ppm, min_availability_ppm, max_p95_latency_ms, max_p99_latency_ms, min_latency_samples]
      properties:
        max_error_rate_ppm: { type: integer, minimum: 0, maximum: 1000000, description: Absolute hard maximum in parts per million }
        min_availability_ppm: { type: integer, minimum: 0, maximum: 1000000, description: Absolute hard minimum in parts per million }
        max_p95_latency_ms: { type: integer, minimum: 1, maximum: 86400000 }
        max_p99_latency_ms: { type: integer, minimum: 1, maximum: 86400000, description: Must be greater than or equal to the p95 limit }
        min_latency_samples: { type: integer, minimum: 1, maximum: 1000000000000, description: Minimum request observations for latency evaluation; insufficient samples never become zero latency }
    SloAvailabilityWindow:
      type: object
      additionalProperties: false
      required: [days, start_time, end_time]
      properties:
        days: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, minimum: 0, maximum: 6 }, description: Sunday is zero }
        start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        end_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Must be later than start_time; overnight windows are unsupported }
    SloAvailability:
      type: object
      additionalProperties: false
      required: [mode, timezone, windows]
      properties:
        mode: { type: string, enum: [ALWAYS, WINDOWS], description: ALWAYS blocks a standalone singleton STOP. WINDOWS requires the whole stop-to-readiness interval outside the declared availability windows. }
        timezone: { type: string, description: Explicit IANA timezone }
        windows: { type: array, maxItems: 32, items: { $ref: '#/components/schemas/SloAvailabilityWindow' }, description: Empty for ALWAYS; at least one same-day window for WINDOWS }
    SloRegression:
      type: object
      additionalProperties: false
      required: [enabled, max_percent]
      properties:
        enabled: { type: boolean, description: Requires a measurable frozen server-selected pre-plan latency baseline when enabled }
        max_percent: { type: integer, minimum: 0, maximum: 1000, description: Independent maximum latency regression percentage; cannot waive a hard limit }
    SloObjectiveRequest:
      type: object
      additionalProperties: false
