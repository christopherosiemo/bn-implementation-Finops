            schema_version: { type: string, enum: ['4'] }
            command_id: { type: string }
            child_id: { type: string }
            outcome: { type: string, enum: [APPLIED, DEFINITELY_NOT_APPLIED, UNKNOWN, NO_OP] }
        replayed: { type: boolean }
