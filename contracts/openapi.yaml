        upper: { $ref: '#/components/schemas/NullableDecimal' }
        status: { type: string, enum: [OBSERVED, UNAVAILABLE] }
    CapacityMetricSummary:
      type: object
      required: [name, unit, statistic, coverage_ppm, time_coverage_ppm, sampling_coverage_ppm, observed_intervals, expected_intervals, missing_intervals, unknown_seconds, observed_samples, observed_quantiles, observed_maximum, quantile_method, denominator, reason_codes]
      properties:
        name: { type: string, enum: [cpu, memory, network, storage_iops, storage_throughput, demand] }
        unit: { type: string }
        semantic_role: { type: string, enum: [REQUEST_THROUGHPUT_PROXY], description: Present only for explicitly versioned v2 request-throughput observations; never proves completed business work }
        source_metric: { type: string, enum: [request_count] }
        source_unit: { type: string, enum: [count, requests], description: Exact registered native counter unit; rate unit remains count/second or requests/second }
        statistic: { type: string, enum: [RAW_SAMPLE, OBSERVED_INTERVAL_RATE, DISTRIBUTION, INTERVAL_MAXIMUM] }
        cadence_seconds: { type: integer }
        coverage_ppm: { type: integer, minimum: 0, maximum: 1000000 }
        time_coverage_ppm: { type: integer, minimum: 0, maximum: 1000000 }
        sampling_coverage_ppm: { type: integer, minimum: 0, maximum: 1000000 }
        observed_intervals: { type: integer }
        expected_intervals: { type: integer }
        missing_intervals: { type: integer }
        unknown_seconds: { type: string }
        observed_samples: { type: string, pattern: '^[0-9]+$' }
        quantile_method: { type: string }
        observed_maximum: { $ref: '#/components/schemas/NullableDecimal' }
        observed_quantiles:
          type: object
          required: [p50, p90, p95, p99, p999]
          properties:
            p50: { $ref: '#/components/schemas/CapacityObservedQuantile' }
            p90: { $ref: '#/components/schemas/CapacityObservedQuantile' }
            p95: { $ref: '#/components/schemas/CapacityObservedQuantile' }
            p99: { $ref: '#/components/schemas/CapacityObservedQuantile' }
            p999: { $ref: '#/components/schemas/CapacityObservedQuantile' }
        denominator:
          type: object
          nullable: true
          required: [unit, value]
          properties: { unit: { type: string }, value: { type: string } }
        missing_ranges:
          type: array
          items: { type: object, required: [start, end], properties: { start: { type: string, format: date-time }, end: { type: string, format: date-time } } }
        missing_range_count: { type: integer }
        reason_codes: { type: array, items: { type: string } }
        source_refs: { type: array, items: { $ref: '#/components/schemas/CapacityModelReference' } }
    CapacityForecastMetric:
      type: object
      required: [status, reason_codes, point_peak, point_p99, prediction_interval, backtest]
      properties:
        semantic_role: { type: string, enum: [REQUEST_THROUGHPUT_PROXY], description: A request-rate projection is not completed-work or work-preservation evidence }
        source_metric: { type: string, enum: [request_count] }
        source_unit: { type: string, enum: [count, requests] }
        unit: { type: string, enum: [count/second, requests/second], description: Explicit native request proxy rate unit in v2; absent in legacy v1 forecasts }
