        cpu: { $ref: '#/components/schemas/NullableDecimal' }
        memory: { $ref: '#/components/schemas/NullableDecimal' }
        network: { $ref: '#/components/schemas/NullableDecimal' }
        storage_iops: { $ref: '#/components/schemas/NullableDecimal' }
        storage_throughput: { $ref: '#/components/schemas/NullableDecimal' }
    NativeHardwareCatalogEntry:
      type: object
      required: [id, count, capacity, architecture, cpu_model, operating_system, licensing, region, zones, accelerator, local_storage, disk_types, commitment_compatible, source_ref, pricing]
      properties:
        id: { type: string }
        count: { type: integer, minimum: 1 }
        capacity: { $ref: '#/components/schemas/NativePhysicalCapacity' }
        architecture: { type: string }
        cpu_model: { type: string }
        operating_system: { type: string }
        licensing: { type: string }
