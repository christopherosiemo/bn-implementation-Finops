        accepted: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        backlog: { type: integer, minimum: 0 }
        inflight: { type: integer, minimum: 0 }
        heartbeat: { type: boolean, enum: [true] }
        incident: { type: string, enum: [CLEAR, ACTIVE, UNKNOWN] }
        deployment: { type: string, enum: [CLEAR, ACTIVE, UNKNOWN] }
        job: { type: string, enum: [CLEAR, ACTIVE, UNKNOWN] }
    Decimal: { type: string, pattern: '^-?[0-9]+(\.[0-9]{1,12})?$' }
    NullableDecimal: { type: string, nullable: true, pattern: '^-?[0-9]+(\.[0-9]{1,12})?$' }
