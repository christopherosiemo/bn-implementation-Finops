        expected_samples: { type: integer, minimum: 0 }
        coverage_ppm: { type: integer, minimum: 0, maximum: 1000000 }
        observed_duration_ns: { type: integer, minimum: 0, description: Exact native duration; the browser must not sum nanoseconds as floating point }
        unknown_duration_ns: { type: integer, minimum: 0 }
        p50: { $ref: '#/components/schemas/NullableDecimal' }
        p90: { $ref: '#/components/schemas/NullableDecimal' }
        p95: { $ref: '#/components/schemas/NullableDecimal' }
        p99: { $ref: '#/components/schemas/NullableDecimal' }
        p999: { $ref: '#/components/schemas/NullableDecimal' }
        maximum: { $ref: '#/components/schemas/NullableDecimal' }
        total: { $ref: '#/components/schemas/NullableDecimal' }
        histogram: { $ref: '#/components/schemas/NativeHistogram' }
        segment_ids: { type: array, maxItems: 16, items: { type: string }, description: Bounded preview only; complete evidence is retained in pinned receipt objects }
        segment_count: { type: integer, minimum: 0 }
        segment_hash: { type: string, description: SHA-256 of all ordered segment IDs }
        segment_ids_truncated: { type: boolean }
        statistic: { type: string, description: Observed sample distribution, explicit bucket population or interval statistic; Maximum is never renamed a quantile }
    NativeTelemetryEvaluation:
      type: object
      required: [schema_version, status, reason_codes, start, end, evaluated_at, metrics, hash]
      properties:
        schema_version: { type: string, enum: ['1'] }
        status: { type: string, enum: [READY, BLOCKED] }
        reason_codes: { type: array, items: { type: string } }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
